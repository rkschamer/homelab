---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pihole
  namespace: pi-hole
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pi-hole
  labels:
    app: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pihole
    spec:
      serviceAccountName: pihole
      containers:
        - name: pihole
          image: pihole/pihole:2026.02.0
          env:
            - name: TZ
              value: Europe/Berlin
            - name: FTLCONF_dns_listeningMode
              value: all
            # Use dnscrypt-proxy sidecar for DNS-over-HTTPS
            - name: FTLCONF_dns_upstreams
              value: "127.0.0.1#5053"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - NET_BIND_SERVICE
                - SETFCAP
                - SETGID
                - SETUID
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
        - name: dnscrypt-proxy
          image: klutchell/dnscrypt-proxy:2.1.5
          args:
            - --config
            - /config/dnscrypt-proxy.toml
          ports:
            - name: dns-proxy
              containerPort: 5053
              protocol: UDP
            - name: dns-proxy-tcp
              containerPort: 5053
              protocol: TCP
          volumeMounts:
            - name: dnscrypt-config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: dnsmasq
          persistentVolumeClaim:
            claimName: pihole-dnsmasq
        - name: dnscrypt-config
          configMap:
            name: dnscrypt-proxy-config
