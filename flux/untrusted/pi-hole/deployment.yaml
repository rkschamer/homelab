---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pihole
  namespace: pi-hole
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pi-hole
  labels:
    app: pihole
spec:
  # Start with 0 replicas for data migration. After copying data to PVCs:
  #   kubectl scale deployment -n pi-hole pihole --replicas=1
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pihole
    spec:
      serviceAccountName: pihole
      containers:
        - name: pihole
          image: pihole/pihole:2026.02.0
          env:
            - name: TZ
              value: Europe/Berlin
            # Required for container networking
            - name: FTLCONF_dns_listeningMode
              value: all
            # Enable dnsmasq.d for v5 migration, can be removed after migration
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: dnsmasq
          persistentVolumeClaim:
            claimName: pihole-dnsmasq
