---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pihole
  namespace: pi-hole
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pi-hole
  labels:
    app: pihole
spec:
  # Start with 0 replicas for data migration. After copying data to PVCs:
  #   kubectl scale deployment -n pi-hole pihole --replicas=1
  replicas: 0
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pihole
    spec:
      serviceAccountName: pihole
      containers:
        - name: pihole
          image: pihole/pihole:latest
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: dnsmasq
          persistentVolumeClaim:
            claimName: pihole-dnsmasq
