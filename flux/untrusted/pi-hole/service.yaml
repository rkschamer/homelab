---
# DNS LoadBalancer Service (dedicated IP - required for externalTrafficPolicy: Local)
# externalTrafficPolicy: Local preserves the real client IP so Pi-hole can apply
# per-client rules (parental filtering, groups, etc.). MetalLB L2 only advertises
# this IP from the node running the Pi-hole pod, so no SNAT occurs.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: pi-hole
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.123.22
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP

---
# Web UI ClusterIP Service (for Traefik backend)
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pi-hole
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
