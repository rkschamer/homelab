---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data
  namespace: karakeep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karakeep
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:0.31.0
          imagePullPolicy: Always
          env:
            - name: DATA_DIR
              value: /data
            - name: NEXTAUTH_URL
              value: https://karakeep.kschamer.info
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secret
                  key: NEXTAUTH_SECRET
            # to allow user creation after success OIDC authentication we need to enable signups
            # and disable password auth, otherwise users would be created but not able to login
            - name: DISABLE_SIGNUPS
              value: "false"
            - name: DISABLE_PASSWORD_AUTH
              value: "true"
            - name: OAUTH_AUTO_REDIRECT
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: Authelia
            - name: OAUTH_WELLKNOWN_URL
              value: https://auth.kschamer.info/.well-known/openid-configuration
            - name: OAUTH_CLIENT_ID
              value: karakeep
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secret
                  key: OAUTH_CLIENT_SECRET
            - name: OAUTH_SCOPE
              value: openid profile email
            - name: DB_WAL_MODE
              value: "true"
            - name: LOG_LEVEL
              value: notice
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data

---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
spec:
  selector:
    app.kubernetes.io/name: karakeep
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
