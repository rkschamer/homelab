---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: donetick-data
  namespace: donetick
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  volumeName: pv-donetick-data
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donetick
  namespace: donetick
spec:
  replicas: 1
  # SQLite has a single write lock — Recreate ensures the old pod is fully
  # terminated before the new one starts, preventing database corruption.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: donetick
  template:
    metadata:
      labels:
        app.kubernetes.io/name: donetick
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: donetick
          image: donetick/donetick:v0.1.76
          env:
            - name: DT_ENV
              value: selfhosted
            - name: DT_SERVER_PUBLIC_HOST
              value: "https://todo.kschamer.info"
            - name: DT_IS_USER_CREATION_DISABLED
              value: "true"
            - name: DT_SQLITE_PATH
              value: /donetick-data/donetick.db
            - name: DT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: donetick-secret
                  key: DT_JWT_SECRET
            - name: DT_EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: donetick-secret
                  key: DT_EMAIL_HOST
            - name: DT_EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: donetick-secret
                  key: DT_EMAIL_PORT
            - name: DT_EMAIL_APPHOST
              value: "https://todo.kschamer.info"
            - name: DT_EMAIL_EMAIL
              valueFrom:
                secretKeyRef:
                  name: donetick-secret
                  key: DT_EMAIL_EMAIL
            - name: DT_EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: donetick-secret
                  key: DT_EMAIL_USER
            - name: DT_EMAIL_KEY
              valueFrom:
                secretKeyRef:
                  name: donetick-secret
                  key: DT_EMAIL_KEY
            - name: DT_OAUTH2_NAME
              value: "Authelia"
            - name: DT_OAUTH2_CLIENT_ID
              value: "donetick"
            - name: DT_OAUTH2_SCOPES
              value: "openid profile email"
            - name: DT_OAUTH2_AUTH_URL
              value: "https://auth.kschamer.info/api/oidc/authorization"
            - name: DT_OAUTH2_TOKEN_URL
              value: "https://auth.kschamer.info/api/oidc/token"
            - name: DT_OAUTH2_USER_INFO_URL
              value: "https://auth.kschamer.info/api/oidc/userinfo"
            - name: DT_OAUTH2_REDIRECT_URL
              value: "https://todo.kschamer.info/auth/oauth2"
            - name: DT_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: donetick-secret
                  key: DT_OAUTH2_CLIENT_SECRET
          ports:
            - containerPort: 2021
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /donetick-data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /
              port: 2021
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 2021
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: donetick-data

---
apiVersion: v1
kind: Service
metadata:
  name: donetick
  namespace: donetick
spec:
  selector:
    app.kubernetes.io/name: donetick
  ports:
    - port: 2021
      targetPort: 2021
      protocol: TCP
