---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: donetick
  namespace: donetick
spec:
  description: "Network policy for DoneTick task manager in the untrusted zone"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: donetick

  ingress:
    # Allow Traefik (DMZ) to proxy requests to DoneTick
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.namespace.labels.network-zone: dmz
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "2021"
              protocol: TCP

  egress:
    # SMTP for email notifications (DT_EMAIL_PORT is configurable; cover common ports)
    # DNS and HTTPS (443) to world are provided by the untrusted zone baseline policy.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
