apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-analysis
  namespace: network-testing
spec:
  selector:
    matchLabels:
      app: network-analysis
  template:
    metadata:
      labels:
        app: network-analysis
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        # Allow scheduling on control plane nodes
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        # For any other taints
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      containers:
        - name: network-analysis
          image: nicolaka/netshoot:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - sleep infinity
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                - SYS_PTRACE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
