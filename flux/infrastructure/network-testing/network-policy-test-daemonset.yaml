---
# Network Policy Test Pods - Uses pod network (NOT hostNetwork)
# These pods are subject to Cilium network policies
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-policy-test
  namespace: network-testing
  labels:
    app: network-policy-test
spec:
  selector:
    matchLabels:
      app: network-policy-test
  template:
    metadata:
      labels:
        app: network-policy-test
    spec:
      # NO hostNetwork - uses pod network, subject to Cilium policies
      dnsPolicy: ClusterFirst
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      containers:
        - name: netshoot
          image: nicolaka/netshoot:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - sleep infinity
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
