# =============================================================================
# Host Network Test DaemonSet - Verify Host Firewall Policy Enforcement
# =============================================================================
# These privileged pods run on the host network, which allows testing
# Cilium's host firewall rules (egressDeny/ingressDeny with nodeSelector).
#
# Regular pods (default network namespace) are NOT subject to host firewall
# rules - only hostNetwork pods are affected.
#
# Usage:
#   kubectl exec -it -n network-testing <pod-name> -- ping 192.168.123.5
#   kubectl exec -it -n network-testing <pod-name> -- curl -v http://192.168.123.1
# =============================================================================

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: host-network-test
  namespace: network-testing
spec:
  selector:
    matchLabels:
      app: host-network-test
  template:
    metadata:
      labels:
        app: host-network-test
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        # Allow scheduling on control plane nodes
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        # For any other taints
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      containers:
        - name: host-network-test
          image: nicolaka/netshoot:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - sleep infinity
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                - SYS_PTRACE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
