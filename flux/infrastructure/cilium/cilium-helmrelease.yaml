---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  url: https://helm.cilium.io

---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.x" # Pin to major version, minor updates automatically
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # IPAM Configuration
    ipam:
      mode: kubernetes

    # kube-proxy replacement
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Security Context Capabilities
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # cgroup Configuration
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Hubble observability
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true

    # Gateway API support
    gatewayAPI:
      enabled: true
      enableAlpn: true
      enableAppProtocol: true

    # Host Firewall for pod-to-pod isolation
    hostFirewall:
      enabled: true

    # Additional settings for eBPF mode
    bpf:
      clockProbe: false
    
    # DNS Proxy for transparent mode
    dnsproxy:
      enableTransparentMode: true

    # Enable Cilium monitoring
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false # Set to true if you have Prometheus Operator

    # PriorityClass for critical system component
    priorityClassName: system-node-critical

    # Pod resource requests
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
