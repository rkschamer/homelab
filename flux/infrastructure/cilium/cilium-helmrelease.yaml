---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  url: https://helm.cilium.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.18.6"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Cluster Configuration
    cluster:
      name: homelab
      id: 0

    # IPAM Configuration
    ipam:
      mode: kubernetes

    # kube-proxy replacement
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Security Context Capabilities
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # cgroup Configuration
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Hubble observability
    hubble:
      enabled: true
      relay:
        enabled: true
        tls:
          server:
            enabled: true
          client:
            enabled: true
            certValidation: background
      ui:
        enabled: true
        tls:
          server:
            enabled: true

    # Host Firewall for pod-to-pod isolation
    hostFirewall:
      enabled: true

    # Policy Audit Mode - logs drops without blocking (for debugging)
    # Set to false once policies are validated
    policyAuditMode: true

    # Routing mode (matches ConfigMap)
    routingMode: tunnel
    tunnelProtocol: vxlan

    # Additional settings for eBPF mode
    bpf:
      clockProbe: false

    # DNS Proxy for transparent mode
    dnsproxy:
      enableTransparentMode: true

    # Enable Cilium monitoring
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false # Set to true if you have Prometheus Operator

    # PriorityClass for critical system component
    priorityClassName: system-node-critical

    # Pod resource requests
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
