---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: hourly-snapshot
  namespace: longhorn-system
spec:
  cron: "0 */2 * * *"
  task: snapshot
  groups:
    - default
  retain: 84 # 7 days worth of snapshots every 2 hours (webhook cap is <= 100)
  concurrency: 1
---
# Prometheus and Loki volumes are in this group instead of default to reduce
# COW chain depth: their constant writes make 2h snapshots saturate disk IO.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: monitoring-snapshot
  namespace: longhorn-system
spec:
  cron: "0 */6 * * *"
  task: snapshot
  groups:
    - monitoring
  retain: 28 # 7 days at 4 snapshots/day
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: backup
  groups:
    - default
    - monitoring
  retain: 30 # 30 days of daily backups
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-delete
  namespace: longhorn-system
spec:
  cron: "30 2 * * *"
  task: snapshot-delete
  groups:
    - default
  retain: 84 # Match snapshot retention (webhook cap is <= 100)
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: monitoring-snapshot-delete
  namespace: longhorn-system
spec:
  cron: "45 2 * * *"
  task: snapshot-delete
  groups:
    - monitoring
  retain: 28 # Match monitoring snapshot retention
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"
  task: snapshot-cleanup
  groups:
    - default
    - monitoring
  # Longhorn mutates this to 0 for snapshot-cleanup tasks.
  retain: 1
  concurrency: 1
