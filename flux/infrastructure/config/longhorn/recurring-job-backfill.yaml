---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-recurring-job-backfill
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-recurring-job-backfill
  namespace: longhorn-system
rules:
  - apiGroups:
      - longhorn.io
    resources:
      - volumes
    verbs:
      - get
      - list
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-recurring-job-backfill
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-recurring-job-backfill
subjects:
  - kind: ServiceAccount
    name: longhorn-recurring-job-backfill
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-recurring-job-backfill
  namespace: longhorn-system
spec:
  # One-shot migration helper. After this succeeds and labels are confirmed,
  # this manifest can be removed from Git.
  activeDeadlineSeconds: 900
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: longhorn-recurring-job-backfill
      containers:
        - name: backfill
          image: registry.k8s.io/kubectl:v1.35.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              volume_names="$(kubectl -n longhorn-system get volumes.longhorn.io -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"

              if [ -z "${volume_names}" ]; then
                echo "No Longhorn volumes found; nothing to backfill."
                exit 0
              fi

              for volume_name in ${volume_names}; do
                labels="$(kubectl -n longhorn-system get volumes.longhorn.io/${volume_name} -o jsonpath='{.metadata.labels}')"

                if echo "${labels}" | grep -Eq 'recurring-job\.longhorn\.io/|recurring-job-group\.longhorn\.io/'; then
                  echo "Skipping ${volume_name}: recurring job labels already exist."
                  continue
                fi

                kubectl -n longhorn-system label volumes.longhorn.io/${volume_name} recurring-job-group.longhorn.io/default=enabled --overwrite
                echo "Labeled ${volume_name} with recurring-job-group.longhorn.io/default=enabled"
              done
