# =============================================================================
# Zone Isolation Policies - Namespace-Based Enforcement
# =============================================================================
# Network zones are now logical, enforced via namespace labels and Cilium
# Network Policies. All worker nodes share the same physical network (10.10.20.0/24).
#
# To use these policies, label namespaces with:
#   kubectl label namespace my-app network-zone=dmz
#
# Network Zones (Pod-Level):
# - Trusted (network-zone: trusted): Internal apps with home LAN access
# - DMZ (network-zone: dmz): Public-facing services (Traefik)
# - Untrusted (network-zone: untrusted): Experimental workloads, internet-only
# - Monitoring (network-zone: monitoring): Observability infrastructure
#
# Key Isolation Rules:
# 1. Untrusted cannot reach: Home LAN, Trusted, DMZ, Monitoring
# 2. DMZ cannot reach: Home LAN (except specific backends), Untrusted
# 3. Monitoring can reach all zones (pull-based metrics collection)
#
# =============================================================================

---
# =============================================================================
# Untrusted Zone Isolation - Block access to internal networks
# =============================================================================
# Pods labeled with network-zone: untrusted should only have internet access.
# All pods in the untrusted zone are blocked from reaching internal networks.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-untrusted-to-internal
spec:
  description: "Block untrusted zone pods from accessing internal networks"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-zone: untrusted
  egressDeny:
  # Strict internet-only: block private RFC1918 ranges.
  # DNS exceptions: allow access to kube-dns service (10.96.0.10/32)
  # and pod CIDR (10.244.0.0/16) so CoreDNS endpoint IPs are reachable.
  - toCIDRSet:
    - cidr: 10.0.0.0/8
      except:
      - 10.96.0.10/32
      - 10.244.0.0/16
  - toCIDR:
    - 172.16.0.0/12
  - toCIDR:
    - 192.168.0.0/16
  # Block Trusted zone (other pods in trusted namespace)
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: trusted
  # Block DMZ zone (other pods in dmz namespace)
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: dmz
  # Block Monitoring zone (other pods in monitoring namespace)
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: monitoring

---
# =============================================================================
# Untrusted Baseline Allow - Essential internet egress
# =============================================================================
# Any workload selected by an egress allow policy must explicitly allow DNS.
# Provide a shared baseline for all untrusted namespaces so app policies don't
# need to duplicate common internet bootstrap traffic.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-untrusted-dns-egress
spec:
  description: "Allow untrusted zone pods DNS plus HTTP/HTTPS internet egress"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-zone: untrusted
  egress:
  # General DNS egress baseline for the untrusted zone.
  # Internal destination restrictions are still enforced by egressDeny rules.
  - toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

  # Shared outbound web access for untrusted workloads.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      - port: "443"
        protocol: TCP

---
# =============================================================================
# DMZ Zone Isolation - Block access to Home LAN
# =============================================================================
# Pods labeled with network-zone: dmz can serve internet traffic but should
# not access the home LAN or any internal networks.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-dmz-to-home-lan
spec:
  description: "Block DMZ zone pods from accessing Home LAN"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-zone: dmz
  egressDeny:
  # Block Home LAN / Management network except explicit legacy bridge targets.
  - toCIDRSet:
    - cidr: 192.168.123.0/24
      except:
      - 192.168.123.5/32 # NAS
      - 192.168.123.8/32 # Proxmox VE
      - 192.168.123.10/32 # Home Assistant
      - 192.168.123.11/32 # ha-proxy LXC (Horsmar HA)
      - 192.168.123.20/32 # Kubernetes API server

---
# =============================================================================
# DMZ Baseline Allow - DNS, Kubernetes API, and Internet Egress
# =============================================================================
# DMZ endpoints are selected by deny policies, which puts them under egress
# enforcement. Provide explicit baseline allows required for ingress controllers
# and public-facing workloads.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dmz-essential-egress
spec:
  description: "Allow DMZ pods to reach DNS, Kubernetes API, and Internet"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-zone: dmz
  egress:
  # Allow in-cluster traffic (service and pod backends). Cross-zone denies
  # below still block DMZ -> monitoring and DMZ -> untrusted.
  - toEntities:
    - cluster

  # Allow DNS to kube-dns service
  - toCIDR:
    - 10.96.0.10/32
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

  # Allow Kubernetes API access for controllers running in DMZ namespace
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "6443"
        protocol: TCP

  # Allow outbound internet access (e.g. ACME, upstream dependencies)
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      - port: "443"
        protocol: TCP
      - port: "123"
        protocol: UDP

---
# =============================================================================
# DMZ to Monitoring Isolation - Enforce pull-only monitoring model
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-dmz-to-monitoring
spec:
  description: "Block DMZ zone pods from pushing traffic to monitoring zone (Traefik excluded — it routes to Grafana)"
  endpointSelector:
    matchExpressions:
    - key: io.cilium.k8s.namespace.labels.network-zone
      operator: In
      values: [dmz]
    - key: app.kubernetes.io/name
      operator: NotIn
      values: [traefik]
  egressDeny:
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: monitoring

---
# =============================================================================
# Trusted to Monitoring Isolation - Enforce pull-only monitoring model
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-trusted-to-monitoring
spec:
  description: "Block trusted zone pods from pushing traffic to monitoring zone"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-zone: trusted
  egressDeny:
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: monitoring

# =============================================================================
# Monitoring Zone - Pull-based access (no ingress from other zones)
# =============================================================================
# Monitoring pods can reach all other zones for metrics collection (outbound).
# However, other zones should NOT be able to push data into monitoring.
# This is a one-directional relationship: monitoring pulls, others don't push.
# =============================================================================

# No explicit deny rules for monitoring zone - it needs to reach everywhere.
# Instead, other zones should have egress rules preventing push to monitoring
# (This could be added if needed, but pull-based is the default pattern).

# Example: Allow monitoring to pull from etcd, API servers, etc.
# (Usually happens automatically via service DNS resolution)

---
# =============================================================================
# Trusted Zone - Allow home LAN access
# =============================================================================
# Pods labeled with network-zone: trusted are allowed to access the home LAN
# and internal services. This is the "safe" zone for home-integrated apps.
# No explicit deny rules - trusted zone can reach most things.
# =============================================================================

# No explicit deny rules needed for trusted - it has default-allow.
# Provide a DNS baseline so per-pod egress policies don't need to repeat it.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-trusted-dns-egress
spec:
  description: "Allow trusted zone pods broad egress baseline (DNS, cluster, home LAN, internet)"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-zone: trusted
  egress:
  # DNS
  - toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # In-cluster traffic (pod and service backends).
  # Cross-zone deny for monitoring is still enforced by deny-trusted-to-monitoring.
  - toEntities:
    - cluster
  # Home LAN / management network (192.168.123.0/24)
  - toCIDR:
    - 192.168.123.0/24
  # Internet egress
  - toEntities:
    - world

---
# =============================================================================
# Explicit Allow: DMZ to Trusted (for Traefik ingress backends)
# =============================================================================
# This is an example policy showing how to allow specific cross-zone traffic.
# Uncomment and customize for your specific use cases.
#
# Example: Allow Traefik (DMZ) to reach Home Assistant service (Trusted)
# =============================================================================

