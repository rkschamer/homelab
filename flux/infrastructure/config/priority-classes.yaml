apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-critical
value: 1000000
globalDefault: false
description: "Core services, which needs to run otherwise cluster loses functionality completely (e.g., Traefik, MetalLB, Sealed Secrets, Authelia, Vaultwarden, Pi-hole)"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-default
value: 0
globalDefault: true
description: "Standard workloads — evicted first under memory pressure"
