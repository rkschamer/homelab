---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-synology
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.123.5
  share: /volume1/k8s
  # Creates namespace/pvc-name subdirectory automatically on the NAS.
  # Set onDeletePolicy=retain to keep NAS data when the PVC is deleted.
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  onDeletePolicy: retain
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
  - hard
