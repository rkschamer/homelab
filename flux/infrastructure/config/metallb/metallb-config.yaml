---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: traefik
  namespace: metallb-system
spec:
  addresses:
  - 192.168.123.21/32

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: traefik
  namespace: metallb-system
spec:
  ipAddressPools:
  - traefik
  nodeSelectors:
  - matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists

---
# Pool for cluster services that need direct home LAN access without Traefik.
# IPs are on the workload network (10.10.20.0/24) so worker nodes can respond
# to ARP. The FritzBox static route (10.10.20.0/24 → 192.168.123.20) makes
# these IPs reachable from the home LAN.
# Note: externalTrafficPolicy: Cluster is required — the control-plane acts as
# router between home LAN and workload network; with Local, Cilium on the
# control-plane drops packets (no local backend) before they reach workers.
# Current allocations:
#   10.10.20.100  pihole-dns (pi-hole/pihole-dns)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: cluster-services
  namespace: metallb-system
spec:
  addresses:
  - 10.10.20.100-10.10.20.150
  autoAssign: false

---
# No nodeSelector: workers advertise their own network (10.10.20.x) natively.
# MetalLB elects the node with the healthy local endpoint as speaker, which
# combined with externalTrafficPolicy: Local ensures no SNAT occurs.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: cluster-services
  namespace: metallb-system
spec:
  ipAddressPools:
  - cluster-services
