---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  url: https://helm.cilium.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Cluster Configuration
    cluster:
      name: homelab
      id: 0

    # IPAM Configuration
    ipam:
      mode: kubernetes

    # kube-proxy replacement
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Security Context Capabilities
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # cgroup Configuration
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Hubble observability
    hubble:
      enabled: true
      relay:
        enabled: true
        tls:
          server:
            enabled: true
          client:
            enabled: true
            certValidation: background
      ui:
        enabled: true
        tls:
          server:
            enabled: true

    # Host Firewall for pod-to-pod isolation
    hostFirewall:
      enabled: true

    # Explicitly set devices to exclude leftover flannel.1 interface
    # which interferes with host firewall BPF programs
    # devices: "ens18"

    # Policy Enforcement Mode
    # - default: Endpoints allow all until selected by a policy (deny rules only)
    # - always: All endpoints start in default-deny (zero-trust)
    # - never: Policy enforcement disabled
    #
    # Using 'default' mode with explicit deny rules for zone isolation.
    # This is simpler than zero-trust and sufficient for homelab where
    # network-level segmentation (VLANs) provides the primary isolation.
    policyEnforcementMode: default

    # Policy Audit Mode disabled - using simple deny rules now
    policyAuditMode: false

    # Routing mode (matches ConfigMap)
    routingMode: tunnel
    tunnelProtocol: vxlan

    # Additional settings for eBPF mode
    bpf:
      clockProbe: false

    # DNS Proxy for transparent mode
    dnsproxy:
      enableTransparentMode: true

    # Enable Cilium monitoring
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false # Set to true if you have Prometheus Operator

    # PriorityClass for critical system component
    priorityClassName: system-node-critical

    # Pod resource requests
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
