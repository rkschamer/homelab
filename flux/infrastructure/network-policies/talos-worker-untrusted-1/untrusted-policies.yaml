---
# Untrusted Worker Node Policies
# talos-worker-untrusted-1

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-untrusted-network-pods
  namespace: default
spec:
  description: "Isolate Untrusted worker - allow internal communication only"
  nodeSelector:
    kubernetes.io/hostname: talos-worker-untrusted-1
  endpointSelector:
    matchLabels:
      network-zone: untrusted
  ingress:
  - fromEndpoints:
    - matchLabels:
        network-zone: untrusted
  # Metrics from monitoring (one-way pull)
  - fromNamespaces:
    - name: monitoring
    fromLabelSelector:
      matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        network-zone: untrusted
  - toNamespaces:
    - name: kube-system
  - toFQDNs:
    - matchName: "*.svc.cluster.local"

---
# Host firewall for Untrusted worker
# NOTE: Base rules are in host-firewall-base.yaml
# Untrusted has MOST restrictive egress - internet only, no internal networks
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-untrusted-worker
spec:
  description: "Untrusted worker specific host firewall rules (strict isolation)"
  nodeSelector:
    kubernetes.io/hostname: talos-worker-untrusted-1
  ingress:
  # Only Prometheus metrics allowed
  - fromEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "9100"
        protocol: TCP
  egress:
  # Internet access only - NO internal networks (except control plane for cluster)
  - toCIDR:
    - 0.0.0.0/0
    exceptCIDR:
    - 192.168.123.0/24  # No home LAN
    - 10.10.20.0/24     # No Trusted
    - 10.10.30.0/24     # No DMZ
    - 10.10.50.0/24     # No Monitoring
