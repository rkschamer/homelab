---
# Untrusted Worker Node Policies
# talos-worker-untrusted-1

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-untrusted-network-pods
  namespace: default
spec:
  description: "Isolate Untrusted worker - allow internal communication only"
  endpointSelector:
    matchLabels:
      network-zone: untrusted
  ingress:
  - fromEndpoints:
    - matchLabels:
        network-zone: untrusted
  # Metrics from prometheus in kube-system (one-way pull)
  - fromEndpoints:
    - matchLabels:
        app: prometheus
      matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        network-zone: untrusted
  # To kube-system (CoreDNS, API server)
  - toEndpoints:
    - matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "443"
        protocol: TCP
  # To DNS (CoreDNS in kube-system)
  - toEndpoints:
    - matchLabels:
        k8s-app: coredns
      matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system

---
# Host firewall for Untrusted worker
# NOTE: Base rules are in host-firewall-base.yaml
# Untrusted has MOST restrictive egress - internet only, no internal networks
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-untrusted-worker
spec:
  description: "Untrusted worker specific host firewall rules (strict isolation)"
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: talos-worker-untrusted-1
  ingress:
  # Only Prometheus metrics allowed
  - fromEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "9100"
        protocol: TCP
  egress:
  # Internet access only (control plane access handled by base rules)
  - toCIDR:
    - 0.0.0.0/0
  # Deny access to internal networks
  egressDeny:
  - toCIDR:
    - 192.168.123.0/24  # No home LAN
  - toCIDR:
    - 10.10.20.0/24     # No Trusted
  - toCIDR:
    - 10.10.30.0/24     # No DMZ
  - toCIDR:
    - 10.10.50.0/24     # No Monitoring
