---
# Control Plane Node Policies
# talos-controlplane-1
#
# NOTE: Base host firewall rules are in host-firewall-base.yaml
# This file contains ADDITIONAL control-plane-specific rules.

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-control-plane
spec:
  description: "Control plane specific host firewall rules (in addition to base rules)"
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: talos-controlplane-1
  ingress:
  # Allow all traffic from management network (home LAN)
  # This is acceptable for homelab - the network is trusted and behind NAT
  # Services still require authentication (K8s API certs, Talos API certs)
  - fromCIDR:
    - 192.168.123.0/24
  # Allow metrics scraping from Prometheus pods
  - fromEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "2379"
        protocol: TCP
      - port: "6443"
        protocol: TCP
  egress:
  # Control plane can reach all worker networks (kubelet)
  - toCIDR:
    - 10.10.20.0/24   # Trusted
    - 10.10.30.0/24   # DMZ
    - 10.10.40.0/24   # Untrusted
    - 10.10.50.0/24   # Monitoring
    toPorts:
    - ports:
      - port: "10250"   # Kubelet API
        protocol: TCP
  # Internet access for Talos discovery, container registries, updates
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "53"      # DNS (external resolvers)
        protocol: UDP
      - port: "53"
        protocol: TCP
      - port: "80"      # HTTP (some registries)
        protocol: TCP
      - port: "443"     # HTTPS (discovery.talos.dev, registries)
        protocol: TCP
