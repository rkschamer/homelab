---
# Control Plane Node Policies
# talos-controlplane-1
#
# NOTE: Base host firewall rules are in host-firewall-policies.yaml
# This file contains ADDITIONAL control-plane-specific rules.
#
# Internet egress (DNS, HTTP, HTTPS) is covered by the shared
# host-allow-internet-egress policy in host-firewall-policies.yaml

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-control-plane
spec:
  description: "Control plane specific host firewall rules (in addition to base rules)"
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: talos-controlplane-1
  ingress:
  # Allow API server access from management network (including Proxmox gateway for IP forwarding)
  # Traffic from Fritzbox is routed through Proxmox (192.168.123.9) which IP forwards to control plane
  - fromCIDR:
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  # Allow metrics scraping from Prometheus pods
  - fromEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "2379"
        protocol: TCP
      - port: "6443"
        protocol: TCP
  egress:
  # Control plane can reach all worker networks (kubelet)
  - toCIDR:
    - 10.10.20.0/24   # Trusted
    - 10.10.30.0/24   # DMZ
    - 10.10.40.0/24   # Untrusted
    - 10.10.50.0/24   # Monitoring
    toPorts:
    - ports:
      - port: "10250"   # Kubelet API
        protocol: TCP
