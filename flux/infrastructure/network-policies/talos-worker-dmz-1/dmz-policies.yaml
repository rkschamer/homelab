---
# DMZ Worker Node Policies
# talos-worker-dmz-1

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-dmz
  namespace: kube-system
spec:
  description: "Allow Traefik on DMZ worker to receive external traffic and forward to backends"
  endpointSelector:
    matchLabels:
      app: traefik
    matchExpressions:
    - key: kubernetes.io/hostname
      operator: In
      values:
      - talos-worker-dmz-1
  ingress:
  # HTTP/HTTPS from internet (via MetalLB)
  - toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      - port: "443"
        protocol: TCP
      - port: "8000"
        protocol: TCP
      - port: "8443"
        protocol: TCP
  # Metrics scraping from monitoring
  - fromNamespaces:
    - name: monitoring
    fromLabelSelector:
      matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  egress:
  # To Trusted network for internal backends (e.g., Home Assistant)
  - toNamespaces:
    - name: homeassistant
    toPorts:
    - ports:
      - port: "8123"
        protocol: TCP
  # To DNS
  - toNamespaces:
    - name: kube-system
    toFQDNs:
    - matchName: "*.svc.cluster.local"
  # To control plane for cluster access
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP

---
# Allow Traefik (DMZ) to reach Trusted network backends
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dmz-to-trusted
  namespace: kube-system
spec:
  description: "Allow Traefik on DMZ worker to reach Trusted network services"
  endpointSelector:
    matchLabels:
      app: traefik
    matchExpressions:
    - key: kubernetes.io/hostname
      operator: In
      values:
      - talos-worker-dmz-1
  egress:
  - toEndpoints:
    - matchLabels:
        network-zone: trusted
    toPorts:
    - ports:
      - port: "8123"
        protocol: TCP
      - port: "6052"
        protocol: TCP
      - port: "5353"
        protocol: TCP

---
# Deny DMZ to Untrusted - Strict isolation
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-dmz-to-untrusted
  namespace: kube-system
spec:
  description: "Explicitly deny DMZ to Untrusted network access"
  endpointSelector:
    matchLabels:
      app: traefik
    matchExpressions:
    - key: kubernetes.io/hostname
      operator: In
      values:
      - talos-worker-dmz-1
  egressDeny:
  - toEndpoints:
    - matchLabels:
        network-zone: untrusted

---
# Host firewall for DMZ worker
# NOTE: Base rules are in host-firewall-base.yaml
# DMZ worker should NOT have direct access to home LAN or other zones
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-dmz-worker
spec:
  description: "DMZ worker specific host firewall rules (restricted egress)"
  nodeSelector:
    kubernetes.io/hostname: talos-worker-dmz-1
  ingress:
  # Allow external traffic for Traefik (MetalLB will route here)
  - fromCIDR:
    - 0.0.0.0/0
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      - port: "443"
        protocol: TCP
  # Metrics from Prometheus
  - fromEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "9100"
        protocol: TCP
  egress:
  # DMZ can reach internet (for Let's Encrypt, etc.)
  - toCIDR:
    - 0.0.0.0/0
    exceptCIDR:
    - 192.168.123.0/24  # Except home LAN (must go through Traefik policies)
    - 10.10.40.0/24     # Except Untrusted (strict isolation)
