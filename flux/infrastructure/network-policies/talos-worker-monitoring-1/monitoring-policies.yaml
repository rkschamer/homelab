---
# Monitoring Worker Node Policies
# talos-worker-monitoring-1

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: kube-system
spec:
  description: "Allow Prometheus to scrape metrics from all networks"
  endpointSelector:
    matchLabels:
      app: prometheus
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
  egress:
  # Scrape all kube-system components
  - toEndpoints:
    - matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
      - port: "10250"
        protocol: TCP
      - port: "6060"
        protocol: TCP
  # Scrape Traefik on DMZ
  - toEndpoints:
    - matchLabels:
        app: traefik
      matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  # Scrape nodes with network-zone labels
  - toEndpoints:
    - matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - default
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  # DNS resolution
  - toEndpoints:
    - matchLabels:
        k8s-app: coredns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-dashboards
  namespace: kube-system
spec:
  description: "Allow Grafana dashboard access"
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
  # From kube-system namespace itself
  - fromEndpoints:
    - matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP

---
# Allow Monitoring to scrape all zones
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-monitoring-cross-zone-scrape
  namespace: kube-system
spec:
  description: "Allow Prometheus to pull metrics from all network zones"
  endpointSelector:
    matchLabels:
      app: prometheus
  egress:
  # Trusted zone
  - toEndpoints:
    - matchLabels:
        network-zone: trusted
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  # DMZ zone
  - toEndpoints:
    - matchLabels:
        network-zone: dmz
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  # Untrusted zone
  - toEndpoints:
    - matchLabels:
        network-zone: untrusted
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP

---
# Host firewall for Monitoring worker
# NOTE: Base rules are in host-firewall-base.yaml
# Monitoring needs special egress to scrape all zones
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-monitoring-worker
spec:
  description: "Monitoring worker specific host firewall rules (can scrape all zones)"
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: talos-worker-monitoring-1
  ingress:
  # Grafana dashboard access from management
  - fromCIDR:
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "3000"   # Grafana
        protocol: TCP
      - port: "9090"   # Prometheus UI
        protocol: TCP
  # Internal metrics
  - fromEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
  egress:
  # Can reach all networks for scraping
  - toCIDR:
    - 192.168.123.0/24  # Management
    - 10.10.20.0/24     # Trusted
    - 10.10.30.0/24     # DMZ
    - 10.10.40.0/24     # Untrusted
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
      - port: "10250"
        protocol: TCP
      - port: "9100"
        protocol: TCP
