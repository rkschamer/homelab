---
# System Component Policies
# Core Kubernetes and cluster infrastructure policies

# ==============================================================================
# Flux System - GitOps Core
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-flux-system-internal
  namespace: flux-system
spec:
  description: "Allow internal Flux components to communicate"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: flux
  egress:
  # Allow Flux components to communicate with each other
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: flux
  # DNS egress covered by cluster-wide default-allow-dns policy
  # Allow access to Kubernetes API server (for reconciliation)
  - toEntities:
    - kube-apiserver
  # Allow egress to external endpoints (GitHub, container registries, Helm repos)
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP

---
# ==============================================================================
# Kube System - Core Kubernetes Components
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-system-metrics
  namespace: kube-system
spec:
  description: "Allow Prometheus scraping metrics from kube-system pods"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        k8s:app: prometheus
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
      - port: "10250"
        protocol: TCP
      - port: "6060"
        protocol: TCP

---
# Allow all kube-system pods to reach the Kubernetes API server
# Required for controllers, operators, and system components to function
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-system-apiserver
  namespace: kube-system
spec:
  description: "Allow kube-system pods to reach Kubernetes API server"
  endpointSelector: {}  # All pods in kube-system namespace
  egress:
  - toEntities:
    - kube-apiserver

---
# ==============================================================================
# CoreDNS - Cluster DNS
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-coredns-ingress
spec:
  description: "Allow CoreDNS to receive DNS queries from all pods cluster-wide"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  ingress:
  # Allow DNS queries from ALL pods in the cluster
  - fromEndpoints:
    - {}
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Health check endpoints from kubelets (host identity)
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
      - port: "8181"
        protocol: TCP
  # Health check from any pod
  - fromEndpoints:
    - {}
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
      - port: "8181"
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-coredns
  namespace: kube-system
spec:
  description: "Allow CoreDNS egress to upstream DNS and API server"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
  # Forward DNS queries to external upstream DNS servers (Cloudflare, Google, etc.)
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow DNS to reach Kubernetes API (for service discovery)
  - toEntities:
    - kube-apiserver

---
# ==============================================================================
# Cilium - CNI and Network Observability
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cilium-internal
  namespace: kube-system
spec:
  description: "Allow Cilium agent internal communication and Hubble"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: cilium
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-ui
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-relay
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium

---
# ==============================================================================
# Hubble Relay - Network Event Aggregation
# ==============================================================================
# Consolidated policy (merged allow-hubble-relay-to-peers and allow-hubble-relay)
# DNS egress covered by cluster-wide default-allow-dns policy

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-relay
  namespace: kube-system
spec:
  description: "Allow Hubble Relay to communicate with Cilium agents and peer services"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-relay
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-ui
    toPorts:
    - ports:
      - port: "4222"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble
    toPorts:
    - ports:
      - port: "4222"
        protocol: TCP
  egress:
  # Allow reaching Hubble daemons on all nodes (port 4244)
  # Cilium agents run on hostNetwork, so we need toCIDR rules
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  # Allow reaching Cilium agents on all node networks (hostNetwork pods)
  - toCIDR:
    - 192.168.123.0/24   # Management network (control plane)
    - 10.10.20.0/24      # Trusted network
    - 10.10.30.0/24      # DMZ network
    - 10.10.40.0/24      # Untrusted network
    - 10.10.50.0/24      # Monitoring network
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  # Allow HTTPS to any endpoint (for hubble-peer service and API server)
  - toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  # Allow reaching Kubernetes API server (for peer discovery service)
  - toEntities:
    - kube-apiserver

---
# ==============================================================================
# Hubble UI - Network Observability Dashboard
# ==============================================================================
# Consolidated policy (merged allow-hubble-ui-access and allow-hubble-ui)
# DNS egress covered by cluster-wide default-allow-dns policy

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-ui
  namespace: kube-system
spec:
  description: "Allow Hubble UI access and backend communication"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-ui
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app: hubble-ui
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  egress:
  # Allow Hubble UI to reach Hubble Relay
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-relay
    toPorts:
    - ports:
      - port: "8085"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP

---
# ==============================================================================
# MetalLB - Load Balancer
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-metallb
  namespace: metallb-system
spec:
  description: "Allow MetalLB speaker and controller communication"
  endpointSelector:
    matchLabels:
      app: metallb
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: metallb
  egress:
  - toEndpoints:
    - matchLabels:
        app: metallb

---
# ==============================================================================
# Sealed Secrets - Secret Management
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sealed-secrets
  namespace: kube-system
spec:
  description: "Allow Sealed Secrets controller communication"
  endpointSelector:
    matchLabels:
      app: sealed-secrets
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: sealed-secrets
  egress:
  - toEndpoints:
    - matchLabels:
        app: sealed-secrets
