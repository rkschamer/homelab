---
# System Component Policies
# Core Kubernetes and cluster infrastructure policies

# ==============================================================================
# Flux System - GitOps Core
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-flux-system-internal
  namespace: flux-system
spec:
  description: "Allow internal Flux components to communicate"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: flux
  egress:
  # Allow Flux components to communicate with each other
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: flux
  # Allow DNS resolution via CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow access to Kubernetes API server (for reconciliation)
  - toEntities:
    - kube-apiserver
  # Allow egress to external endpoints (GitHub, container registries, Helm repos)
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP

---
# ==============================================================================
# Kube System - Core Kubernetes Components
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-system-metrics
  namespace: kube-system
spec:
  description: "Allow Prometheus scraping metrics from kube-system pods"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        k8s:app: prometheus
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
      - port: "10250"
        protocol: TCP
      - port: "6060"
        protocol: TCP

---
# ==============================================================================
# CoreDNS - Cluster DNS
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-coredns
  namespace: kube-system
spec:
  description: "Allow CoreDNS to receive DNS queries and forward to upstreams"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
  # Allow DNS queries from all pods
  - fromEndpoints:
    - {}
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Health check endpoints
  - fromEndpoints:
    - {}
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
      - port: "8181"
        protocol: TCP
  egress:
  # Forward DNS queries to external upstream DNS servers (Cloudflare, Google, etc.)
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Allow DNS to reach Kubernetes API (for service discovery)
  - toEntities:
    - kube-apiserver

---
# ==============================================================================
# Cilium - CNI and Network Observability
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cilium-internal
  namespace: kube-system
spec:
  description: "Allow Cilium agent internal communication and Hubble"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: cilium
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-ui
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-relay
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-relay-to-peers
  namespace: kube-system
spec:
  description: "Allow Hubble Relay to reach Hubble daemons on all nodes across networks"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-relay
  egress:
  # Allow reaching Hubble daemons on all nodes (port 4244)
  # Cilium agents run on hostNetwork, so we need toCIDR rules
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  # Allow reaching Cilium agents on all node networks (hostNetwork pods)
  - toCIDR:
    - 192.168.123.0/24   # Management network (control plane)
    - 10.10.20.0/24      # Trusted network
    - 10.10.30.0/24      # DMZ network
    - 10.10.40.0/24      # Untrusted network
    - 10.10.50.0/24      # Monitoring network
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  # Allow DNS for peer discovery
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
  # Allow reaching Kubernetes API server (for peer discovery service)
  - toEntities:
    - kube-apiserver

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-ui-access
  namespace: kube-system
spec:
  description: "Allow Hubble UI to reach Hubble Relay"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-ui
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-relay
    toPorts:
    - ports:
      - port: "8085"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP

---
# ==============================================================================
# Hubble Relay - Network Event Aggregation
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-relay
  namespace: kube-system
spec:
  description: "Allow Hubble relay to communicate with peer service and Kubernetes API"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-relay
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-ui
    toPorts:
    - ports:
      - port: "4222"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble
    toPorts:
    - ports:
      - port: "4222"
        protocol: TCP
  egress:
  # Allow connection to Cilium agents for Hubble peer discovery
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  # Allow HTTPS to any endpoint (for hubble-peer service and API server)
  - toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  # Allow DNS queries for service discovery
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP

---
# ==============================================================================
# Hubble UI - Network Observability Dashboard
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-ui
  namespace: kube-system
spec:
  description: "Allow Hubble UI access and backend communication"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-ui
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app: hubble-ui
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP

---
# ==============================================================================
# MetalLB - Load Balancer
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-metallb
  namespace: metallb-system
spec:
  description: "Allow MetalLB speaker and controller communication"
  endpointSelector:
    matchLabels:
      app: metallb
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: metallb
  egress:
  - toEndpoints:
    - matchLabels:
        app: metallb

---
# ==============================================================================
# Sealed Secrets - Secret Management
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sealed-secrets
  namespace: kube-system
spec:
  description: "Allow Sealed Secrets controller communication"
  endpointSelector:
    matchLabels:
      app: sealed-secrets
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: sealed-secrets
  egress:
  - toEndpoints:
    - matchLabels:
        app: sealed-secrets
