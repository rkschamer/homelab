---
# System Component Policies
# Core Kubernetes and cluster infrastructure policies

# ==============================================================================
# Flux System - GitOps Core
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-flux-system-internal
  namespace: flux-system
spec:
  description: "Allow internal Flux components to communicate"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: flux
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: flux
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: coredns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP

---
# ==============================================================================
# Kube System - Core Kubernetes Components
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-system-metrics
  namespace: kube-system
spec:
  description: "Allow Prometheus scraping metrics from kube-system pods"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        k8s:app: prometheus
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
      - port: "10250"
        protocol: TCP
      - port: "6060"
        protocol: TCP

---
# ==============================================================================
# Cilium - CNI and Network Observability
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cilium-internal
  namespace: kube-system
spec:
  description: "Allow Cilium agent internal communication and Hubble"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: cilium
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-ui
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium

---
# ==============================================================================
# Hubble Relay - Network Event Aggregation
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-relay
  namespace: kube-system
spec:
  description: "Allow Hubble relay to communicate with peer service and Kubernetes API"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-relay
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble-ui
    toPorts:
    - ports:
      - port: "4222"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble
    toPorts:
    - ports:
      - port: "4222"
        protocol: TCP
  egress:
  # Allow connection to Cilium agents for Hubble peer discovery
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: cilium
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  # Allow connection to any endpoint on port 443 (Kubernetes API, peer service via DNS)
  - toEndpoints:
    - matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: Exists
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  # Allow DNS queries for service discovery
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP

---
# ==============================================================================
# Hubble UI - Network Observability Dashboard
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-ui
  namespace: kube-system
spec:
  description: "Allow Hubble UI access and backend communication"
  endpointSelector:
    matchLabels:
      k8s:k8s-app: hubble-ui
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app: hubble-ui
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: hubble
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP

---
# ==============================================================================
# MetalLB - Load Balancer
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-metallb
  namespace: metallb-system
spec:
  description: "Allow MetalLB speaker and controller communication"
  endpointSelector:
    matchLabels:
      app: metallb
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: metallb
  egress:
  - toEndpoints:
    - matchLabels:
        app: metallb

---
# ==============================================================================
# Sealed Secrets - Secret Management
# ==============================================================================

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sealed-secrets
  namespace: kube-system
spec:
  description: "Allow Sealed Secrets controller communication"
  endpointSelector:
    matchLabels:
      app: sealed-secrets
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: sealed-secrets
  egress:
  - toEndpoints:
    - matchLabels:
        app: sealed-secrets
