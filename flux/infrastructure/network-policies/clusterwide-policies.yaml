# =============================================================================
# ClusterWide Pod Policies - Zero-Trust Foundation
# =============================================================================
# These policies use `endpointSelector` to control POD/WORKLOAD traffic.
# They are always active regardless of Cilium's hostFirewall setting.
#
# PURPOSE: Application-level zero-trust (DNS access for all pods)
# SCOPE: All pods cluster-wide
# SELECTOR: endpointSelector {} selects all pods
#
# ENFORCEMENT MODE: policyEnforcementMode=always
# With `always` mode, ALL endpoints start in default-deny automatically.
# We no longer need a policy to "trigger" default-deny - it's built-in.
# This policy only needs to ALLOW the baseline traffic (DNS).
#
# See host-firewall-policies.yaml for node-level infrastructure policies.
# =============================================================================

---
# -----------------------------------------------------------------------------
# Allow DNS Egress for All Pods
# -----------------------------------------------------------------------------
# With policyEnforcementMode=always, all pods are in default-deny.
# This policy grants DNS access to CoreDNS for all pods cluster-wide.
#
# NOTE: This replaces the old "default-deny" policy which was designed for
# policyEnforcementMode=default. With `always` mode, namespace exclusions
# are ineffective - kube-system pods need explicit allow rules too.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  description: "Allow all pods to query CoreDNS for DNS resolution"
  endpointSelector: {}  # All pods cluster-wide
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"

---
# Allow API Server Access for All Pods
# With policyEnforcementMode=always, all pods need explicit API server access.
# This is critical infrastructure required by all pods for:
# - Service discovery via DNS
# - Webhook admission controllers
# - Custom resource watchers
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-apiserver-egress
spec:
  description: "Allow all pods to reach Kubernetes API server"
  endpointSelector: {}  # All pods
  egress:
  # API server entity (covers ClusterIP 10.96.0.1)
  - toEntities:
    - kube-apiserver
  # API server on control plane node IPs across all networks
  # (Required when kube-apiserver runs on node host and DNS to entity doesn't match)
  - toCIDR:
    - 192.168.123.0/24   # Management network
    - 10.10.20.0/24      # Trusted network
    - 10.10.30.0/24      # DMZ network
    - 10.10.40.0/24      # Untrusted network
    - 10.10.50.0/24      # Monitoring network
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
