# =============================================================================
# ClusterWide Pod Policies - Zero-Trust Foundation
# =============================================================================
# These policies use `endpointSelector` to control POD/WORKLOAD traffic.
# They are always active regardless of Cilium's hostFirewall setting.
#
# PURPOSE: Application-level zero-trust (default deny, DNS access)
# SCOPE: All pods in the cluster
# SELECTOR: endpointSelector (matches pods)
#
# NOTE: Keep this file SEPARATE from host-firewall-base.yaml because:
# - Different selector types (endpointSelector vs nodeSelector)
# - Different enablement (always active vs requires hostFirewall: true)
# - Easier troubleshooting (pod issues vs node connectivity issues)
# - Independent deployment/testing lifecycle
#
# See host-firewall-base.yaml for node-level infrastructure policies.
# =============================================================================

# ---
# Default Deny (commented out - enable for strict zero-trust)
# ---

# apiVersion: cilium.io/v2
# kind: CiliumClusterwideNetworkPolicy
# metadata:
#   name: default-deny-ingress
# spec:
#   description: "Default deny all ingress traffic cluster-wide (zero-trust)"
#   endpointSelector: {}  # Select all endpoints
#   ingress:
#   - {}  # Empty rule means no ingress allowed by default

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-allow-dns
spec:
  description: "Allow DNS queries to coredns cluster-wide"
  endpointSelector: {}  # Select all endpoints
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
