# =============================================================================
# ClusterWide Pod Policies - Zero-Trust Foundation
# =============================================================================
# These policies use `endpointSelector` to control POD/WORKLOAD traffic.
# They are always active regardless of Cilium's hostFirewall setting.
#
# PURPOSE: Application-level zero-trust (default deny, DNS access)
# SCOPE: All pods EXCEPT kube-system (critical infrastructure excluded)
# SELECTOR: endpointSelector with matchExpressions to exclude system namespaces
#
# HOW IT WORKS:
# - A policy with ONLY `egress` rules implicitly denies all ingress
# - A policy with ONLY `ingress` rules implicitly denies all egress
# - Empty endpointSelector {} selects ALL pods - DON'T DO THIS for system traffic
# - Use matchExpressions to exclude critical namespaces
#
# See host-firewall-policies.yaml for node-level infrastructure policies.
# =============================================================================

---
# Default Deny Policy (excludes kube-system)
# Pattern from: https://docs.cilium.io/en/latest/network/servicemesh/default-deny-ingress-policy/
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  description: "Default deny all traffic except DNS (excludes kube-system)"
  endpointSelector:
    matchExpressions:
    # Exclude critical system namespaces from this policy
    - key: io.kubernetes.pod.namespace
      operator: NotIn
      values:
      - kube-system
      - cilium-secrets
  # Only DNS egress is allowed - everything else is implicitly denied
  # No ingress rules = all ingress denied
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      rules:
        dns:
        - matchPattern: "*"
