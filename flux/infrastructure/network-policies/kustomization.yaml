---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: network-policies
  namespace: flux-system

resources:
  # =============================================================================
  # IMPORTANT: Apply order matters for host firewall!
  # =============================================================================
  # 1. host-firewall-base.yaml - MUST be applied first when hostFirewall is enabled
  #    Contains essential node-to-node communication rules (API server, kubelet, DNS)
  # 2. clusterwide-policies.yaml - Global policies (default-deny, DNS allow)
  # 3. system-policies.yaml - Core system component policies
  # 4. Per-node policies - Zone-specific isolation rules
  # =============================================================================

  # Host firewall base policies (REQUIRED for hostFirewall: true)
  - host-firewall-policies.yaml

  # Clusterwide policies
  - clusterwide-policies.yaml

  # System component policies
  - system-policies.yaml

  # Per-node policies
  - talos-controlplane-1
  - talos-worker-dmz-1
  - talos-worker-trusted-1
  - talos-worker-untrusted-1
  - talos-worker-monitoring-1
