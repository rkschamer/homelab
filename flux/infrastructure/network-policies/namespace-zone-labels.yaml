# =============================================================================
# Namespace Zone Labels Reference
# =============================================================================
# This file documents how to apply network zone labels to namespaces.
# These labels are used by Cilium Network Policies to enforce pod-level isolation.
#
# All network zones now share the same physical network (10.10.20.0/24).
# Isolation is enforced at the pod level via namespace labels and Cilium policies.
#
# Usage:
#   kubectl label namespace my-app network-zone=dmz
#   OR
#   Apply the manifests below
# =============================================================================

---
# =============================================================================
# Trusted Zone
# =============================================================================
# Purpose: Internal services with home LAN access
# Examples: Home Assistant, NAS, file servers, databases, internal dashboards
# Connectivity: Can reach home LAN (192.168.123.0/24), other internal services
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: homeassistant
  labels:
    network-zone: trusted

---
apiVersion: v1
kind: Namespace
metadata:
  name: storage
  labels:
    network-zone: trusted

---
apiVersion: v1
kind: Namespace
metadata:
  name: databases
  labels:
    network-zone: trusted

---
# =============================================================================
# DMZ Zone
# =============================================================================
# Purpose: Public-facing services isolated from home LAN
# Examples: Traefik Ingress Controller, public APIs, reverse proxies
# Connectivity: Can reach internet, explicit backends on trusted network
#               BLOCKED from: Home LAN (192.168.123.0/24)
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    network-zone: dmz

---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    network-zone: dmz

---
apiVersion: v1
kind: Namespace
metadata:
  name: public-api
  labels:
    network-zone: dmz

---
# =============================================================================
# Untrusted Zone
# =============================================================================
# Purpose: Experimental workloads, development, testing, sandboxing
# Examples: Dev environments, test deployments, untrusted workloads
# Connectivity: Internet-only
#               BLOCKED from: Home LAN, Trusted, DMZ, Monitoring
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: experimental
  labels:
    network-zone: untrusted

---
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    network-zone: untrusted

---
apiVersion: v1
kind: Namespace
metadata:
  name: testing
  labels:
    network-zone: untrusted

---
# =============================================================================
# Monitoring Zone
# =============================================================================
# Purpose: Observability infrastructure, metrics collection
# Examples: Prometheus, Grafana, Hubble, Alertmanager, Loki
# Connectivity: Can reach all zones (pull-based metrics collection)
#               Others cannot push to monitoring
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    network-zone: monitoring

---
# =============================================================================
# Integration: Labeling Existing Namespaces
# =============================================================================
# If you have existing namespaces (kube-system, default, etc.), you can
# label them at runtime:
#
#   # Label system components as trusted
#   kubectl label namespace kube-system network-zone=trusted
#
#   # Label flux-system as trusted
#   kubectl label namespace flux-system network-zone=trusted
#
#   # Label MetalLB as trusted (it needs to reach all zones)
#   kubectl label namespace metallb-system network-zone=trusted
# =============================================================================

---
# =============================================================================
# Cilium Policies Reference
# =============================================================================
# See zone-isolation-deny.yaml for Cilium Network Policies that enforce
# zone-based isolation using these labels.
#
# Policies read `io.cilium.k8s.namespace.labels.network-zone` from pods
# and apply deny rules based on zone membership.
#
# Key Rules:
# - Untrusted zone: Blocked from Home LAN, Trusted, DMZ, Monitoring
# - DMZ zone: Blocked from Home LAN (to protect private network)
# - DMZ to Untrusted: Prevented cross-zone access
# - Monitoring zone: Can reach everywhere (pull-based)
# - Trusted zone: Can reach most things (default allow)
# =============================================================================

---
# =============================================================================
# Example: Custom Zone-Specific Policies
# =============================================================================
# Once namespaces are labeled, you can create custom policies for
# fine-grained access control.
#
# Example 1: Allow Traefik (DMZ) to route to Home Assistant (Trusted)
# =============================================================================
# apiVersion: cilium.io/v2
# kind: CiliumNetworkPolicy
# metadata:
#   name: allow-dmz-to-homeassistant
#   namespace: homeassistant
# spec:
#   description: "Allow Traefik (DMZ) to route to Home Assistant (Trusted)"
#   endpointSelector:
#     matchLabels:
#       app: homeassistant
#   ingress:
#   - from:
#     - namespaceSelector:
#         matchLabels:
#           network-zone: dmz
#     ports:
#     - protocol: TCP
#       port: "8123"

---
# =============================================================================
# Example 2: Allow Prometheus to scrape metrics from trusted zone
# =============================================================================
# apiVersion: cilium.io/v2
# kind: CiliumNetworkPolicy
# metadata:
#   name: allow-monitoring-scrape
#   namespace: homeassistant
# spec:
#   description: "Allow Prometheus to scrape metrics"
#   endpointSelector:
#     matchLabels:
#       app: myapp
#   ingress:
#   - from:
#     - namespaceSelector:
#         matchLabels:
#           network-zone: monitoring
#     ports:
#     - protocol: TCP
#       port: "9090"  # Prometheus metrics port
