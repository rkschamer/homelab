---
# Trusted Worker Node Policies
# talos-worker-trusted-1

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-trusted-network-pods
  namespace: default
spec:
  description: "Allow pods on Trusted worker to communicate with each other"
  endpointSelector:
    matchLabels:
      network-zone: trusted
  ingress:
  - fromEndpoints:
    - matchLabels:
        network-zone: trusted
  # Allow from Traefik (DMZ) for ingress
  - fromEndpoints:
    - matchLabels:
        app: traefik
      matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
  # Metrics from prometheus in kube-system
  - fromEndpoints:
    - matchLabels:
        app: prometheus
      matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        network-zone: trusted
  # To kube-system (CoreDNS, API server, etc.)
  - toEndpoints:
    - matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "443"
        protocol: TCP
  # To DNS (CoreDNS in kube-system)
  - toEndpoints:
    - matchLabels:
        k8s-app: coredns
      matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
        - kube-system

---
# Host firewall for Trusted worker
# NOTE: Base rules are in host-firewall-base.yaml
# This adds Trusted-worker-specific rules only
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-trusted-worker
spec:
  description: "Trusted worker specific host firewall rules"
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: talos-worker-trusted-1
  ingress:
  # Allow access from home LAN (Trusted zone has home network access)
  - fromCIDR:
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
  # Allow metrics from Prometheus pods
  - fromEndpoints:
    - matchLabels:
        app: prometheus
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "9100"
        protocol: TCP
  egress:
  # Can reach home LAN (this is what makes it "trusted")
  - toCIDR:
    - 192.168.123.0/24
  # Internet access for image pulls, app APIs, etc.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "53"      # DNS
        protocol: UDP
      - port: "53"
        protocol: TCP
      - port: "80"      # HTTP
        protocol: TCP
      - port: "443"     # HTTPS
        protocol: TCP
