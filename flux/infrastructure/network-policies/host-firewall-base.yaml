---
# =============================================================================
# Host Firewall Base Policies
# =============================================================================
# These policies are REQUIRED when hostFirewall is enabled in Cilium.
# They allow essential node-to-node and cluster infrastructure traffic.
#
# Without these policies, the following will break:
# - API server communication from workers
# - Kubelet communication between nodes
# - CoreDNS resolution (when running on different nodes)
# - Cilium agent peer communication
# - etcd cluster communication (if multi-node control plane)
# =============================================================================

# -----------------------------------------------------------------------------
# Allow All Nodes to Reach Control Plane API Server
# -----------------------------------------------------------------------------
# Workers on isolated networks (10.10.x.0/24) need to reach the API server
# on the management network (192.168.123.20:6443).
#
# This rule allows traffic FROM all node networks TO the control plane.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-apiserver-access
spec:
  description: "Allow all nodes to reach Kubernetes API server"
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: talos-controlplane-1
  ingress:
  # From worker nodes on all isolated networks
  - fromCIDR:
    - 10.10.20.0/24   # Trusted network
    - 10.10.30.0/24   # DMZ network
    - 10.10.40.0/24   # Untrusted network
    - 10.10.50.0/24   # Monitoring network
    - 192.168.123.0/24  # Management network (other control planes if HA)
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  # From pods (already covered, but explicit for clarity)
  - fromEndpoints:
    - {}
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP

---
# -----------------------------------------------------------------------------
# Allow All Nodes to Egress to API Server
# -----------------------------------------------------------------------------
# Workers need to initiate connections to the Kubernetes API server for:
# - kubelet registration
# - watching pod specs
# - reporting status
#
# This rule allows egress FROM all nodes TO the control plane API server.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-apiserver-egress
spec:
  description: "Allow all nodes to reach Kubernetes API server"
  nodeSelector:
    matchLabels: {}  # All nodes
  egress:
  # To control plane API server on ALL its interface IPs
  # The control plane has interfaces on each network:
  # Using /24 CIDRs because Cilium maps IPs to subnet-based identities
  - toCIDR:
    - 192.168.123.0/24   # Management network (control plane IP: .20)
    - 10.10.20.0/24      # Trusted network (control plane interface: .2)
    - 10.10.30.0/24      # DMZ network (control plane interface: .2)
    - 10.10.40.0/24      # Untrusted network (control plane interface: .2)
    - 10.10.50.0/24      # Monitoring network (control plane interface: .2)
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  # To API server identity (covers ClusterIP access)
  - toEntities:
    - kube-apiserver

---
# -----------------------------------------------------------------------------
# Allow Control Plane to Reach Worker Kubelets
# -----------------------------------------------------------------------------
# The API server needs to reach kubelets on workers for:
# - Pod exec/logs
# - Metrics collection
# - Health checks
#
# This rule allows traffic FROM the control plane TO all worker networks.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-kubelet-from-controlplane
spec:
  description: "Allow control plane to reach worker kubelets"
  nodeSelector:
    matchLabels: {}  # All nodes (workers will receive kubelet traffic)
  ingress:
  # From control plane node IP
  - fromCIDR:
    - 192.168.123.20/32  # Control plane IP
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
  # From API server identity (for pod exec/logs via apiserver)
  - fromEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP

---
# -----------------------------------------------------------------------------
# Allow Inter-Node Cilium Agent Communication
# -----------------------------------------------------------------------------
# Cilium agents run on hostNetwork and need to communicate with each other
# for VXLAN/Geneve tunneling, health checks, and cluster mesh.
#
# This is critical for pod-to-pod traffic across nodes.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-cilium-inter-node
spec:
  description: "Allow Cilium agents to communicate between nodes"
  nodeSelector:
    matchLabels: {}  # All nodes
  ingress:
  # From other cluster nodes (reserved:remote-node identity)
  - fromEntities:
    - remote-node
    - kube-apiserver
    toPorts:
    - ports:
      - port: "8472"    # VXLAN
        protocol: UDP
      - port: "6081"    # Geneve
        protocol: UDP
      - port: "4240"    # Cilium health
        protocol: TCP
      - port: "4244"    # Hubble peer
        protocol: TCP
  # Cilium VXLAN/Geneve tunneling (CIDR fallback for non-node traffic)
  - fromCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "8472"    # VXLAN
        protocol: UDP
      - port: "6081"    # Geneve
        protocol: UDP
  # Cilium health checks
  - fromCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "4240"    # Cilium health
        protocol: TCP
  # Hubble peer discovery (Cilium agents expose this)
  - fromCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "4244"    # Hubble peer
        protocol: TCP
  # Allow hubble-relay pod to reach Cilium agents on all nodes
  # Hubble-relay has a pod IP (10.244.x.x), not a node IP, so needs explicit rule
  - fromEndpoints:
    - matchLabels:
        k8s-app: hubble-relay
    toPorts:
    - ports:
      - port: "4244"
        protocol: TCP
  egress:
  # Allow Cilium agents to reach other nodes (using entity for proper matching)
  - toEntities:
    - remote-node
    - kube-apiserver
    toPorts:
    - ports:
      - port: "8472"
        protocol: UDP
      - port: "6081"
        protocol: UDP
      - port: "4240"
        protocol: TCP
      - port: "4244"
        protocol: TCP
  # CIDR fallback
  - toCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "8472"
        protocol: UDP
      - port: "6081"
        protocol: UDP
      - port: "4240"
        protocol: TCP
      - port: "4244"
        protocol: TCP

---
# -----------------------------------------------------------------------------
# Allow Workers to Reach CoreDNS (wherever it runs)
# -----------------------------------------------------------------------------
# CoreDNS can run on any node. Workers need to reach it for DNS resolution.
# Since we don't know which node CoreDNS will be on, we allow DNS traffic
# from all nodes to all nodes.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-dns-cross-node
spec:
  description: "Allow DNS traffic between nodes for CoreDNS access"
  nodeSelector:
    matchLabels: {}  # All nodes
  ingress:
  - fromCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  egress:
  - toCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

---
# -----------------------------------------------------------------------------
# Allow Node-to-Node Health Probes
# -----------------------------------------------------------------------------
# Kubernetes and Cilium use health probes between nodes.
# This allows ICMP ping in both directions.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-node-health
spec:
  description: "Allow health probes between nodes"
  nodeSelector:
    matchLabels: {}  # All nodes
  ingress:
  # ICMP ping from other nodes (entity-based for remote-node identity)
  - fromEntities:
    - remote-node
    - kube-apiserver
    icmps:
    - fields:
      - type: 8  # Echo request
        family: IPv4
  # ICMP ping for node health (CIDR fallback)
  - fromCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    icmps:
    - fields:
      - type: 8  # Echo request
        family: IPv4
  egress:
  # ICMP ping to other nodes (entity-based)
  - toEntities:
    - remote-node
    - kube-apiserver
    icmps:
    - fields:
      - type: 8  # Echo request
        family: IPv4
  # ICMP ping to other nodes for health checks (CIDR fallback)
  - toCIDR:
    - 10.10.20.0/24
    - 10.10.30.0/24
    - 10.10.40.0/24
    - 10.10.50.0/24
    - 192.168.123.0/24
    icmps:
    - fields:
      - type: 8  # Echo request
        family: IPv4

---
# -----------------------------------------------------------------------------
# Allow Talos API Access (for talosctl)
# -----------------------------------------------------------------------------
# The Talos API (port 50000) is used by talosctl for node management.
# This should only be accessible from the management network.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-talos-api
spec:
  description: "Allow Talos API access from management network"
  nodeSelector:
    matchLabels: {}  # All nodes
  ingress:
  - fromCIDR:
    - 192.168.123.0/24  # Only from management network
    toPorts:
    - ports:
      - port: "50000"
        protocol: TCP
      - port: "50001"   # Talos trustd
        protocol: TCP

---
# -----------------------------------------------------------------------------
# Allow Host to Reach Pod Health Endpoints (Kubelet Probes)
# -----------------------------------------------------------------------------
# The kubelet performs liveness/readiness probes on pods. These probes
# come from the host and need to reach pods on their health ports.
# This also covers Cilium health endpoints on other nodes.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-health-egress
spec:
  description: "Allow kubelet and Cilium health probes to reach pods"
  nodeSelector:
    matchLabels: {}  # All nodes
  egress:
  # Allow kubelet liveness/readiness probes to CoreDNS
  - toEndpoints:
    - matchLabels:
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "8080"    # CoreDNS /health endpoint
        protocol: TCP
      - port: "8181"    # CoreDNS /ready endpoint
        protocol: TCP
  # Allow kubelet probes to any pod on common health ports
  - toCIDR:
    - 10.244.0.0/16   # Pod CIDR
    toPorts:
    - ports:
      - port: "4240"    # Cilium health check port
        protocol: TCP
      - port: "8080"    # Common health endpoint
        protocol: TCP
      - port: "8181"    # Common readiness endpoint
        protocol: TCP
  # Allow ICMP ping to health endpoints
  - toCIDR:
    - 10.244.0.0/16
    icmps:
    - fields:
      - type: 8  # Echo request
        family: IPv4
  # Allow health checks to reach reserved:health identity endpoints
  - toEntities:
    - health

---
# -----------------------------------------------------------------------------
# Allow NTP Time Synchronization
# -----------------------------------------------------------------------------
# Nodes need to sync time with NTP servers for certificate validation,
# logging timestamps, and cluster coordination.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-ntp-egress
spec:
  description: "Allow nodes to reach NTP servers for time sync"
  nodeSelector:
    matchLabels: {}  # All nodes
  egress:
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "123"
        protocol: UDP
