---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 1h
  url: https://metallb.universe.tf

---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      version: ">=0.0.0"
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    controller:
      enabled: true
    speaker:
      enabled: true
