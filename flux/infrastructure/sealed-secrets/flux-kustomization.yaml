---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/infrastructure/sealed-secrets
  prune: true
  wait: true
  timeout: 5m0s
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sealed-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
