# =============================================================================
# Sealed Secrets Network Policies
# =============================================================================
# Sealed Secrets runs in the sealed-secrets namespace and provides a sealing
# API that all pods in the cluster need to access. These policies:
#
# 1. Allow all pods to reach the sealed-secrets sealing service (port 8080)
# 2. Allow sealed-secrets controller to egress to DNS and kube-api
# 3. Enforce infrastructure zone designation
# =============================================================================

---
# =============================================================================
# Allow all pods to reach Sealed Secrets sealing API
# =============================================================================
# Any pod in the cluster may need to access the sealing API to encrypt secrets.
# This is a critical service that must be reachable from all namespaces.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sealed-secrets-sealing-api
  namespace: sealed-secrets
spec:
  description: "Allow all pods to reach sealed-secrets sealing API on port 8080"
  endpointSelector: {}  # Match all pods in sealed-secrets namespace
  ingress:
  - fromEndpoints:
    - {}  # Allow from any pod in the cluster
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

---
# =============================================================================
# Allow sealed-secrets egress to DNS
# =============================================================================
# Sealed-secrets controller needs to resolve DNS names for reaching the API
# and other services.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sealed-secrets-dns
  namespace: sealed-secrets
spec:
  description: "Allow sealed-secrets to egress to DNS"
  endpointSelector: {}  # Match all pods in sealed-secrets namespace
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: coredns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP

---
# =============================================================================
# Allow sealed-secrets communication with Kubernetes API
# =============================================================================
# The controller needs to watch and manage resources in the cluster.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sealed-secrets-kube-api
  namespace: sealed-secrets
spec:
  description: "Allow sealed-secrets to reach Kubernetes API server"
  endpointSelector: {}  # Match all pods in sealed-secrets namespace
  egress:
  # Allow to Kubernetes API (usually 10.96.0.1:443 or control plane IP)
  - toCIDR:
    - 10.96.0.1/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP

---
# =============================================================================
# Default deny for sealed-secrets ingress (everything not explicitly allowed)
# =============================================================================
# Complement the allow rules with default deny for unlisted ports/endpoints.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-sealed-secrets-ingress
  namespace: sealed-secrets
spec:
  description: "Default deny all ingress except explicitly allowed"
  endpointSelector: {}
  ingress: []  # Empty ingress: deny all not matching allow policies above
