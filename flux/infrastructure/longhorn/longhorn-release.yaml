apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: longhorn-system
spec:
  interval: 1m0s
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1m0s
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: v1.11.0
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # StorageClass default used by Kubernetes PVC provisioning.
    # This sets `numberOfReplicas` on the generated `longhorn` StorageClass.
    # IMPORTANT:  this number MUST NOT exceed the number of available Longhorn nodes,
    #             otherwise provisioning will fail.
    persistence:
      defaultClassReplicaCount: 2

    # Longhorn manager default used by Longhorn UI/API volume creation paths.
    # Keep aligned with `persistence.defaultClassReplicaCount` to avoid drift.
    # IMPORTANT:  this number MUST NOT exceed the number of available Longhorn nodes,
    #             otherwise provisioning will fail.
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: "2"
