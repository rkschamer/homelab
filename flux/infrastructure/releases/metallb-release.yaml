---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
      version: "0.15.3"
  install:
      createNamespace: true
      crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Controller deployment configuration
    controller:
      priorityClassName: homelab-critical
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    # Speaker DaemonSet configuration
    speaker:
      priorityClassName: homelab-critical
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      ignoreExcludeLB: true
      # Tolerate control-plane nodes if needed
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Use memberlist for speaker communication
      # secretName: metallb-memberlist

    # Prometheus monitoring
    # prometheus:
    #   serviceAccount: prometheus-release-kube-pr-prometheus
    #   serviceMonitor:
    #     enabled: true
    #   prometheusRule:
    #     enabled: true
