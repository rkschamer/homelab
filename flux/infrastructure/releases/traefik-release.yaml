# Traefik is placed in infrastructure-releases (not flux/dmz) because its
# HelmRelease installs the IngressRoute CRDs that every other kustomization
# (dmz, trusted, untrusted, monitoring) references. If Traefik were reconciled
# as part of the dmz kustomization, Flux dry-run validation of IngressRoute
# resources in that same pass would fail with "no matches for kind IngressRoute"
# before the CRDs exist — blocking the entire dmz, trusted, untrusted, and
# monitoring kustomizations. infrastructure-releases runs before all of those,
# so the CRDs are guaranteed to be present when the workload kustomizations
# are applied.
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    network-zone: dmz

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://helm.traefik.io/traefik

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      version: "41.0.0"
  values:
    priorityClassName: homelab-critical

    global:
      sendAnonymousUsage: true

    api:
      dashboard: true
      basePath: /traefik

    certificatesResolvers:
      letsencrypt:
        acme:
          email: rene.kschamer@gmail.com
          storage: /data/acme.json
          dnsChallenge:
            provider: porkbun

    deployment:
      replicas: 1
      # Traefik 3.7+ requires acme.json to have exactly 600 permissions.
      # podSecurityContext.fsGroup causes Kubernetes to apply g+rw on every pod
      # restart, turning 600 into 660 and breaking the ACME resolver at startup.
      # This init container resets the permissions before Traefik starts.
      initContainers:
        - name: fix-acme-permissions
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - "touch /data/acme.json && chmod 600 /data/acme.json"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

    podSecurityContext:
      fsGroup: 65532

    updateStrategy:
      type: Recreate

    env:
      # Disable CNAME support for DNS challenge - ACME/LEGO would otherwise
      # follow the CNAME for *.kschamer.info to the dynamic IP, causing failure
      - name: LEGO_DISABLE_CNAME_SUPPORT
        value: "true"
      - name: PORKBUN_API_KEY
        valueFrom:
          secretKeyRef:
            name: traefik-dns-porkbun
            key: api-key
      - name: PORKBUN_SECRET_API_KEY
        valueFrom:
          secretKeyRef:
            name: traefik-dns-porkbun
            key: secret-key

    volumes:
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        type: secret

    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 1Gi

    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik

    service:
      enabled: true
      type: LoadBalancer
      annotations:
        metallb.io/address-pool: traefik
        metallb.io/allow-shared-ip: homelab-shared
      loadBalancerIP: 192.168.123.21

    ports:
      web:
        exposedPort: 80
        # Redirect disabled during migration testing
        # http:
        #   redirections:
        #     entryPoint:
        #       to: websecure
        #       scheme: https
        #       permanent: true
      websecure:
        exposedPort: 443

    metrics:
      prometheus:
        enabled: true
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        serviceMonitor:
          enabled: true

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true

    # Enable access logs so the CrowdSec agent can parse them
    log:
      level: INFO
      format: json

    accessLog:
      enabled: true
      format: json
      fields:
        defaultMode: keep
        names:
          ServiceName: keep

    # CrowdSec bouncer plugin - inspects/blocks requests via CrowdSec LAPI + AppSec
    experimental:
      plugins:
        crowdsec-bouncer-traefik-plugin:
          moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
          version: "v1.5.1"
