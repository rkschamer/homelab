---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: snapshot-controller-repo
  namespace: longhorn-system
spec:
  interval: 1m0s
  url: https://piraeus.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: longhorn-system
spec:
  interval: 5m0s
  chart:
    spec:
      chart: snapshot-controller
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: snapshot-controller-repo
      version: 5.0.3
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    priorityClassName: homelab-critical
    installCRDs: true
    webhook:
      enabled: false
