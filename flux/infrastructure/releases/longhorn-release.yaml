apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: longhorn-system
spec:
  interval: 1m0s
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1m0s
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: 1.11.2
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # StorageClass default used by Kubernetes PVC provisioning.
    # This sets `numberOfReplicas` on the generated `longhorn` StorageClass.
    # IMPORTANT:  this number MUST NOT exceed the number of available Longhorn nodes,
    #             otherwise provisioning will fail.
    persistence:
      defaultClassReplicaCount: 2
      # Apply recurring jobs to every new volume provisioned by the default
      # Longhorn StorageClass (StorageClass parameter: recurringJobSelector).
      #
      # This selects the RecurringJob group named "default", so any RecurringJob
      # manifest that includes groups: [default] is auto-assigned to new volumes.
      # Equivalent StorageClass selector JSON:
      # [{"name":"default","isGroup":true}]
      #
      # If you add another StorageClass later that should NOT auto-run backups,
      # leave recurringJobSelector disabled/empty on that StorageClass.
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"default","isGroup":true}]'

    csi:
      # Homelab sizing: reduce CSI control-plane replica fan-out to lower steady CPU load.
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1

    # Longhorn manager default used by Longhorn UI/API volume creation paths.
    # Keep aligned with `persistence.defaultClassReplicaCount` to avoid drift.
    # IMPORTANT:  this number MUST NOT exceed the number of available Longhorn nodes,
    #             otherwise provisioning will fail.
    longhornManager:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: "2"
      # 3 concurrent rebuilds balances recovery speed against NVMe I/O saturation.
      # Raise to 5 temporarily when draining a large rebuild queue after a node failure.
      concurrentReplicaRebuildPerNodeLimit: "3"
