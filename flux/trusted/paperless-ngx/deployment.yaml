---
# =============================================================================
# paperless-ngx Deployment
# =============================================================================
# Three containers in a single pod (sidecars share localhost):
#   paperless  - webserver + worker + scheduler (all-in-one image)
#   gotenberg  - PDF/Office document conversion (http://localhost:3000)
#   tika       - Text extraction from Office files (http://localhost:9998)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  replicas: 1
  # Recreate: SQLite write lock allows only one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-critical
      securityContext:
        fsGroup: 1000
      containers:
        # -----------------------------------------------------------------------
        # paperless-ngx: webserver + worker + scheduler
        # -----------------------------------------------------------------------
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: paperless-secret
          env:
            - name: PAPERLESS_REDIS
              value: "redis://paperless-redis:6379"
            - name: PAPERLESS_TIKA_ENABLED
              value: "1"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: "http://localhost:9998"
            - name: PAPERLESS_GOTENBERG_ENDPOINT
              value: "http://localhost:3000"
            - name: PAPERLESS_MEDIA_ROOT
              value: "/usr/src/paperless/media"
            - name: PAPERLESS_DATA_DIR
              value: "/usr/src/paperless/data"
            - name: PAPERLESS_CONSUMPTION_DIR
              value: "/usr/src/paperless/consume"
            - name: PAPERLESS_URL
              value: "https://paperless.kschamer.info"
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: "https://paperless.kschamer.info"
            - name: PAPERLESS_ALLOWED_HOSTS
              value: "*"
            - name: PAPERLESS_APPS
              value: "allauth.socialaccount.providers.openid_connect"
            - name: PAPERLESS_DISABLE_REGULAR_LOGIN
              value: "true"
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: "true"
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
              value: "false"
            - name: PAPERLESS_ACCOUNT_EMAIL_VERIFICATION
              value: "none"
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: "https://auth.kschamer.info/logout"
            - name: PAPERLESS_EMAIL_PORT
              value: "587"
            - name: PAPERLESS_EMAIL_USE_TLS
              value: "true"
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

        # -----------------------------------------------------------------------
        # Gotenberg: PDF and Office document conversion
        # -----------------------------------------------------------------------
        - name: gotenberg
          image: docker.io/gotenberg/gotenberg:8.32
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*|https?://.*
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

        # -----------------------------------------------------------------------
        # Tika: Text extraction from Office documents
        # -----------------------------------------------------------------------
        - name: tika
          image: docker.io/apache/tika:3.3.0.0
          ports:
            - containerPort: 9998
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume

---
# =============================================================================
# paperless-ngx Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  selector:
    app.kubernetes.io/name: paperless-ngx
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
