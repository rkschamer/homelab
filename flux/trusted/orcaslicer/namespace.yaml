---
apiVersion: v1
kind: Namespace
metadata:
  name: orcaslicer
  labels:
    network-zone: trusted
    # baseline allows the hostIPC/hostPID exemptions OrcaSlicer doesn't need,
    # but restricted would block the seccomp:Unconfined we require below.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
