---
apiVersion: v1
kind: Namespace
metadata:
  name: orcaslicer
  labels:
    network-zone: trusted
    # privileged is required because OrcaSlicer needs seccompProfile.type: Unconfined
    # (userfaultfd/clone3 syscalls via Selkies WebRTC); baseline and above forbid it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
