---
# =============================================================================
# OrcaSlicer IngressRoute
#
# Middlewares applied (in order):
#   1. crowdsec-bouncer      — blocks malicious IPs via CrowdSec.
#   2. authelia-forwardauth  — SSO via Authelia.
#
# The backend uses scheme: https because the lscr.io/linuxserver/orcaslicer
# container only serves on HTTPS (port 3001). skip-tls-verification is needed
# as the container uses a self-signed certificate.
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orcaslicer
  namespace: orcaslicer
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`slicer.kschamer.info`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik
        - name: authelia-forwardauth
          namespace: traefik
      services:
        - name: orcaslicer
          port: 3001
          scheme: https
          serversTransport: traefik/skip-tls-verification
          namespace: orcaslicer
  tls:
    certResolver: letsencrypt
    domains:
      - main: kschamer.info
        sans:
          - "*.kschamer.info"
