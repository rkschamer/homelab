---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pihole
  namespace: pi-hole
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pi-hole
  labels:
    app.kubernetes.io/name: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole
    spec:
      serviceAccountName: pihole
      containers:
        - name: pihole
          image: pihole/pihole:2026.04.0
          env:
            - name: TZ
              value: Europe/Berlin
            - name: FTLCONF_dns_listeningMode
              value: all
            # Use Unbound sidecar for recursive DNS resolution
            - name: FTLCONF_dns_upstreams
              value: "127.0.0.1#5335"
            # Delegate reverse lookups for home LAN to FritzBox
            - name: FTLCONF_dns_revServers
              value: "true,192.168.123.0/24,192.168.123.1,fritz.box"
            # increse API rate limits because currently all request come from the same IP (the sidecar)
            # due to SNAT config for pihole (at the moment)
            - name: FTLCONF_dns_rateLimit_count
              value: "10000"
            - name: FTLCONF_dns_rateLimit_interval
              value: "60"

          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - NET_BIND_SERVICE
                - NET_RAW
                - SYS_NICE
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
        - name: unbound
          image: mvance/unbound:1.22.0
          volumeMounts:
            - name: unbound-config
              mountPath: /opt/unbound/etc/unbound/unbound.conf
              subPath: unbound.conf
            - name: unbound-dev
              mountPath: /opt/unbound/etc/unbound/dev
            - name: unbound-var
              mountPath: /opt/unbound/etc/unbound/var
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - MKNOD
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: dnsmasq
          persistentVolumeClaim:
            claimName: pihole-dnsmasq
        - name: unbound-config
          configMap:
            name: unbound-config
        - name: unbound-dev
          emptyDir: {}
        - name: unbound-var
          emptyDir: {}
