---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talosctl
  namespace: talosctl
spec:
  description: "Network policy for Talos admin toolbox in Trusted zone"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: talosctl

  # Trusted zone has a broad baseline policy. Keep explicit allowances here
  # so this workload is self-documented and easier to tighten later.
  egress:
    - toCIDR:
        - 192.168.123.20/32
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    - toCIDR:
        - 10.10.20.2/32
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
