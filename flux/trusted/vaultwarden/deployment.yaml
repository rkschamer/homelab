---
# =============================================================================
# Vaultwarden PersistentVolumeClaim
# Stores the SQLite database and attachments
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  volumeName: pv-vaultwarden-data
  resources:
    requests:
      storage: 5Gi

---
# =============================================================================
# Vaultwarden Deployment
# https://github.com/dani-garcia/vaultwarden
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  # Recreate strategy: Vaultwarden uses SQLite by default — only one replica can
  # hold the write lock. Recreate ensures the old pod is gone before the new one
  # starts, preventing database corruption during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.1-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: vaultwarden-secret
          env:
            - name: ROCKET_PORT
              value: "8080"
            - name: DATA_FOLDER
              value: /data
            # Adjust to your actual domain
            - name: DOMAIN
              value: "https://vw.kschamer.info"
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            - name: SMTP_SECURITY
              value: "starttls"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Vaultwarden writes temp files outside /data
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data

---
# =============================================================================
# Vaultwarden Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector:
    app.kubernetes.io/name: vaultwarden
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
