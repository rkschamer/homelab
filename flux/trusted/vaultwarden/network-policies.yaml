---
# =============================================================================
# Vaultwarden Network Policy - Trusted Zone
# =============================================================================
# Vaultwarden is an internal password manager that should:
# - Receive HTTPS requests from Traefik (DMZ) only — no direct LAN access to pod
# - Reach the internet for Bitwarden push notification relay (optional)
# - Reach DNS for resolution
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  description: "Network policy for Vaultwarden password manager in Trusted zone"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden

  # =========================================================================
  # INGRESS: Who can reach Vaultwarden
  # =========================================================================
  ingress:
    # Allow Traefik (DMZ) to proxy requests to Vaultwarden
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.namespace.labels.network-zone: dmz
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

  # =========================================================================
  # EGRESS: What Vaultwarden can reach
  # =========================================================================
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Bitwarden push notification relay (https://push.bitwarden.com)
    # Remove this block if you do not use mobile push notifications
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
