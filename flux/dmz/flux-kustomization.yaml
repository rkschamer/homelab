---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dmz
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-config
  interval: 10m0s
  path: ./flux/dmz
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
