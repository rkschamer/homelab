---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-authelia-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    volumeHandle: pv-authelia-data
    fsType: ext4
    volumeAttributes:
      migratable: "true"
      numberOfReplicas: "2"
      staleReplicaTimeout: "2880"
  claimRef:
    namespace: authelia
    name: authelia

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia
  namespace: authelia
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  volumeName: pv-authelia-data
  resources:
    requests:
      storage: 1Gi
