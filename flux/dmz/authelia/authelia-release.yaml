---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  url: https://charts.authelia.com

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      sourceRef:
        kind: HelmRepository
        name: authelia
      version: "0.11.5"
  values:
    ingress:
      enabled: false

    pod:
      kind: Deployment
      replicas: 1
      priorityClassName: homelab-critical
      strategy:
        type: Recreate
      env:
        - name: AUTHELIA_NOTIFIER_SMTP_ADDRESS
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: SMTP_ADDRESS
        - name: AUTHELIA_NOTIFIER_SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: SMTP_USERNAME
        - name: AUTHELIA_NOTIFIER_SMTP_SENDER
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: SMTP_SENDER
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Persist SQLite database — required for WebAuthn device registrations
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

    # Mount users_database.yml and SMTP password from the sealed secret
    secret:
      additionalSecrets:
        authelia-secrets:
          items:
            - key: users_database.yml
              path: users_database.yml
            - key: SMTP_PASSWORD
              path: SMTP_PASSWORD
            - key: OIDC_PRIVATE_KEY
              path: OIDC_PRIVATE_KEY

    configMap:
      access_control:
        default_policy: deny
        rules:
          - domain: "*.kschamer.info"
            policy: two_factor

      # File-based authentication — user database mounted from secret
      authentication_backend:
        file:
          enabled: true
          watch: false
          path: /secrets/authelia-secrets/users_database.yml

      # Session scoped to kschamer.info, stored in memory
      session:
        expiration: 1h
        inactivity: 30m
        remember_me: 1M
        cookies:
          - domain: kschamer.info
            subdomain: auth

      # SQLite storage — no PostgreSQL needed
      storage:
        local:
          enabled: true
          path: /config/db.sqlite3

      # SMTP notifications — address/username/sender injected via env vars; password via chart secret mechanism
      notifier:
        filesystem:
          enabled: false
        smtp:
          enabled: true
          tls:
            skip_verify: false
            minimum_version: TLS1.2
          password:
            secret_name: authelia-secrets
            path: SMTP_PASSWORD

      identity_providers:
        oidc:
          enabled: true
          claims_policies:
            karakeep:
              id_token:
                - 'email'
                - 'email_verified'
                - 'alt_emails'
                - 'preferred_username'
                - 'name'
          jwks:
            - key_id: 'main'
              algorithm: 'RS256'
              use: 'sig'
              key:
                path: '/secrets/authelia-secrets/OIDC_PRIVATE_KEY'
          clients:
            - client_id: 'donetick'
              client_name: 'Donetick'
              client_secret: '$pbkdf2-sha512$310000$vYfWXAM9Z9M48tYWnU7vFw$ySBmsnZtvzu7.G1wQcD0KyO5XkY5soJeuO6xaq6FVSbGaWbW0wyXLZEj2fkm6dNjxY72bpGtQEvt057Xm/P2og'
              public: false
              authorization_policy: 'two_factor'
              require_pkce: false
              pkce_challenge_method: ''
              redirect_uris:
                - 'https://todo.kschamer.info/auth/oauth2'
                - 'donetick://auth/oauth2' # deep-link URI required for mobile app SSO
              scopes:
                - 'openid'
                - 'profile'
                - 'email'
              access_token_signed_response_alg: 'none'
              userinfo_signed_response_alg: 'none'
              token_endpoint_auth_method: 'client_secret_basic'
            - client_id: 'karakeep'
              client_name: 'Karakeep'
              client_secret: '$pbkdf2-sha512$310000$KQA51yV1zcaAHY.HSWEOJA$qXi3JIZ7HbSHb8XKNP3GHIZBWAX33xcD1APWHLflXG0FNtueceVTQ0eS.VZxN60vfzKfSdfcbvrKg1VJT./oVA'
              public: false
              authorization_policy: 'two_factor'
              claims_policy: 'karakeep'
              require_pkce: false
              pkce_challenge_method: ''
              redirect_uris:
                - 'https://karakeep.kschamer.info/api/auth/callback/custom'
              scopes:
                - 'openid'
                - 'profile'
                - 'email'
              access_token_signed_response_alg: 'none'
              userinfo_signed_response_alg: 'none'
              token_endpoint_auth_method: 'client_secret_basic'
            - client_id: 'paperless'
              client_name: 'Paperless-ngx'
              client_secret: '$pbkdf2-sha512$310000$0SUV3FCuRVj55bR/sNKesA$DaA9xXDrpvcAYVAE3WEC.Mj7pzz4WFkjxZeDUUlizdUMLSgJGC9pmWRS.FSIB1wlY3623BjXnnWx86lTd5pzqQ'
              public: false
              authorization_policy: 'two_factor'
              require_pkce: false
              pkce_challenge_method: ''
              redirect_uris:
                - 'https://paperless.kschamer.info/accounts/oidc/authelia/login/callback/'
              scopes:
                - 'openid'
                - 'profile'
                - 'email'
              access_token_signed_response_alg: 'none'
              userinfo_signed_response_alg: 'none'
              token_endpoint_auth_method: 'client_secret_basic'
