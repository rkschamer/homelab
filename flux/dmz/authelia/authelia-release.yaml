---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  url: https://charts.authelia.com

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      sourceRef:
        kind: HelmRepository
        name: authelia
      version: "0.10.50"
  values:
    ingress:
      enabled: false

    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate
      env:
        - name: AUTHELIA_NOTIFIER_SMTP_ADDRESS
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: SMTP_ADDRESS
        - name: AUTHELIA_NOTIFIER_SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: SMTP_USERNAME
        - name: AUTHELIA_NOTIFIER_SMTP_SENDER
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: SMTP_SENDER
        - name: AUTHELIA_NOTIFIER_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: SMTP_PASSWORD
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Persist SQLite database — required for WebAuthn device registrations
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

    # Mount users_database.yml from the sealed secret as an additional volume
    secret:
      additionalSecrets:
        authelia-secrets:
          items:
            - key: users_database.yml
              path: users_database.yml

    configMap:
      access_control:
        default_policy: two_factor

      # File-based authentication — user database mounted from secret
      authentication_backend:
        file:
          enabled: true
          watch: false
          path: /secrets/authelia-secrets/users_database.yml

      # Session scoped to kschamer.info, stored in memory
      session:
        expiration: 1h
        inactivity: 30m
        remember_me: 1M
        cookies:
          - domain: kschamer.info
            subdomain: auth

      # SQLite storage — no PostgreSQL needed
      storage:
        local:
          enabled: true
          path: /config/db.sqlite3

      # SMTP notifications — address/username/sender/password injected via env vars from authelia-secrets
      # AUTHELIA_NOTIFIER_SMTP_ADDRESS format: "smtp.example.com:587"
      notifier:
        filesystem:
          enabled: false
        smtp:
          enabled: true
          tls:
            skip_verify: false
            minimum_version: TLS1.2
