---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  url: https://charts.authelia.com

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      sourceRef:
        kind: HelmRepository
        name: authelia
      version: "0.10.50"
  values:
    ingress:
      enabled: false

    pod:
      kind: Deployment
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Persist SQLite database — required for WebAuthn device registrations
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

    # Mount users_database.yml from the sealed secret
    secret:
      existingSecret: authelia-secrets
      additionalSecrets:
        authelia-secrets:
          items:
            - key: users_database.yml
              path: users_database.yml

    configMap:
      # File-based authentication — user database mounted from secret
      authentication_backend:
        file:
          enabled: true
          watch: false
          path: /secrets/users_database.yml

      # Session scoped to kschamer.info, stored in memory
      session:
        expiration: 1h
        inactivity: 30m
        remember_me: 1M
        # Encryption key auto-generated by chart
        encryption_key:
          secret_name: ~
          path: session.encryption.key
        cookies:
          - domain: kschamer.info
            subdomain: auth
            default_redirection_url: https://auth.kschamer.info

      # SQLite storage — no PostgreSQL needed
      storage:
        # Encryption key auto-generated by chart
        encryption_key:
          secret_name: ~
          path: storage.encryption.key
        local:
          enabled: true
          path: /config/db.sqlite3

      # Notify via filesystem log — no email server needed for single user
      notifier:
        filesystem:
          enabled: true
          filename: /config/notification.txt

      # JWT for password reset links, auto-generated by chart
      identity_validation:
        reset_password:
          jwt_algorithm: HS256
          secret:
            secret_name: ~
            path: identity_validation.reset_password.jwt.hmac.key
