---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  url: https://charts.authelia.com

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      sourceRef:
        kind: HelmRepository
        name: authelia
      version: "0.10.50"
  values:
    domain: kschamer.info

    ingress:
      enabled: false

    pod:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Persist SQLite database across restarts
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

    # File-based authentication backend — user database from secret
    configMap:
      authentication_backend:
        file:
          enabled: true
          watch: false
          path: /secrets/users_database.yml

      # Session stored in memory — acceptable for single-instance homelab
      session:
        cookies:
          - domain: kschamer.info
            authelia_url: https://auth.kschamer.info
            default_redirection_url: https://auth.kschamer.info
        expiration: 1h
        inactivity: 30m
        remember_me: 1M

      # SQLite storage — no PostgreSQL needed
      storage:
        local:
          enabled: true

      # Notify via log only (no email server needed for single user)
      notifier:
        filesystem:
          enabled: true

    secret:
      existingSecret: authelia-secrets
      jwt:
        key: JWT_TOKEN
      session:
        key: SESSION_ENCRYPTION_KEY
      storageEncryptionKey:
        key: STORAGE_ENCRYPTION_KEY
      # Mount users_database.yml from the same secret
      additionalSecrets:
        authelia-secrets:
          items:
            - key: users_database.yml
              path: users_database.yml
