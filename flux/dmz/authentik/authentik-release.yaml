---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  url: https://charts.goauthentik.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
      version: "2026.2.1"
  values:
    # Use external secret for all authentik configuration
    authentik:
      existingSecret:
        secretName: authentik-secrets
      error_reporting:
        enabled: false

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      # Disable built-in ingress (we use Traefik IngressRoute)
      ingress:
        enabled: false

    worker:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi

    # Bundled PostgreSQL
    postgresql:
      enabled: true
      auth:
        existingSecret: authentik-secrets
        username: authentik
        database: authentik
      primary:
        persistence:
          enabled: true
          size: 2Gi
          storageClass: longhorn

    # Bundled Redis
    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          enabled: false

    # Public URL configuration (required for OAuth2/OIDC redirects)
    # These cannot be set in the secret, so we set them as env vars
    global:
      env:
        - name: AUTHENTIK_HOST
          value: "https://auth.kschamer.info"
        - name: AUTHENTIK_COOKIE_DOMAIN
          value: ".kschamer.info"
