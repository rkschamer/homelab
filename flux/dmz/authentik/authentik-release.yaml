---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  url: https://charts.goauthentik.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
      version: "2026.2.2"
  values:
    authentik:
      # Secret values (AUTHENTIK_* env vars) come from the existing secret via envFrom
      existingSecret:
        secretName: generic-secret
      error_reporting:
        enabled: false
      log_level: info

    server:
      replicas: 1
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      # Disable built-in ingress (we use Traefik IngressRoute)
      ingress:
        enabled: false

    worker:
      replicas: 1
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi

    # Bundled PostgreSQL
    postgresql:
      enabled: true
      auth:
        existingSecret: postgresql-secret
        secretKeys:
          userPasswordKey: password
        username: authentik
        database: authentik
      primary:
        persistence:
          enabled: true
          size: 2Gi
          storageClass: longhorn

    # Bundled Redis
    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          enabled: false

    # Non-secret runtime config passed as env vars
    # NOTE: when existingSecret is used, the chart's generated secret is skipped entirely.
    # All AUTHENTIK_* vars that would have been in that secret must be supplied here or in the secret.
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "authentik-postgresql"
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__USER
          value: "authentik"
        - name: AUTHENTIK_COOKIE_DOMAIN
          value: ".kschamer.info"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_AVATARS
          value: "gravatar,initials"
