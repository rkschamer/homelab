  name: ext-homeassistant-horsmar
  namespace: traefik
  labels:
    kubernetes.io/service-name: ext-homeassistant-horsmar
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.123.11  # ha-proxy LXC - TCP proxy to Horsmar
ports:
  - name: http
    port: 8123
    protocol: TCP

