# External backends exposed through Kubernetes Services:
# - Each Service below intentionally has no selector.
# - The matching Endpoints object provides explicit external IP:port targets
#   (LAN services outside Kubernetes).
# - Traefik routes use these Services as stable Kubernetes names for hybrid
#   routing, during migration and for workloads that remain external.
# - Without Endpoints, these Services would have no backends and requests would
#   fail with upstream unavailable errors.
---
apiVersion: v1
kind: Service
metadata:
  name: ext-homeassistant
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123

---
apiVersion: v1
kind: Endpoints
metadata:
  name: ext-homeassistant
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.123.10
    ports:
      - name: http
        port: 8123
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ext-homeassistant-horsmar
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123

---
apiVersion: v1
kind: Endpoints
metadata:
  name: ext-homeassistant-horsmar
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.123.11  # ha-proxy LXC - TCP proxy to Horsmar
    ports:
      - name: http
        port: 8123
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ext-pve
  namespace: traefik
spec:
  ports:
    - name: https
      port: 8006
      protocol: TCP
      targetPort: 8006

---
apiVersion: v1
kind: Endpoints
metadata:
  name: ext-pve
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.123.8
    ports:
      - name: https
        port: 8006
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ext-nas
  namespace: traefik
spec:
  ports:
    - name: https
      port: 5001
      protocol: TCP
      targetPort: 5001

---
apiVersion: v1
kind: Endpoints
metadata:
  name: ext-nas
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.123.5
    ports:
      - name: https
        port: 5001
