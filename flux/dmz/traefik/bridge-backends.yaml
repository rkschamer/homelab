# External backends exposed through Kubernetes Services:
# - Each Service below intentionally has no selector.
# - The matching EndpointSlice object provides explicit external IP:port targets
#   (LAN services outside Kubernetes).
# - Traefik routes use these Services as stable Kubernetes names for hybrid
#   routing, during migration and for workloads that remain external.
# - Without EndpointSlices, these Services would have no backends and requests would
#   fail with upstream unavailable errors.
---
apiVersion: v1
kind: Service
metadata:
  name: ext-homeassistant
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-homeassistant-external
  namespace: traefik
  labels:
    kubernetes.io/service-name: ext-homeassistant
    endpointslice.kubernetes.io/managed-by: homelab.gitops
addressType: IPv4
ports:
  - name: http
    port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.123.10
    conditions:
      ready: true

---
apiVersion: v1
kind: Service
metadata:
  name: ext-homeassistant-horsmar
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-homeassistant-horsmar-external
  namespace: traefik
  labels:
    kubernetes.io/service-name: ext-homeassistant-horsmar
    endpointslice.kubernetes.io/managed-by: homelab.gitops
addressType: IPv4
ports:
  - name: http
    port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.123.11 # horsmar-proxy LXC - TCP proxy to Horsmar
    conditions:
      ready: true

---
