# External backends exposed through Kubernetes Services:
# - Each Service below intentionally has no selector.
# - The matching EndpointSlice provides explicit external IP:port targets
#   (LAN services outside Kubernetes).
# - Traefik routes use these Services as stable Kubernetes names for hybrid
#   routing, during migration and for workloads that remain external.
# - Without EndpointSlices, these Services would have no backends and requests
#   would fail with upstream unavailable errors.
---
apiVersion: v1
kind: Service
metadata:
  name: ext-homeassistant
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-homeassistant
  namespace: traefik
  labels:
    kubernetes.io/service-name: ext-homeassistant
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.123.10
ports:
  - name: http
    port: 8123
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ext-homeassistant-horsmar
  namespace: traefik
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
