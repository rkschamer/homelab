---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    network-zone: dmz

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://helm.traefik.io/traefik

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      version: "39.0.6"
  values:
    global:
      sendAnonymousUsage: true

    api:
      dashboard: true
      basePath: /traefik

    certificatesResolvers:
      letsencrypt:
        acme:
          email: rene.kschamer@gmail.com
          storage: /data/acme.json
          dnsChallenge:
            provider: porkbun

    deployment:
      replicas: 1
      env:
        - name: PORKBUN_API_KEY
          valueFrom:
            secretKeyRef:
              name: traefik-porkbun-dns
              key: api-key
              optional: true
        - name: PORKBUN_SECRET_API_KEY
          valueFrom:
            secretKeyRef:
              name: traefik-porkbun-dns
              key: secret-key
              optional: true

    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 1Gi

    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik

    service:
      enabled: true
      type: LoadBalancer
      annotations:
        metallb.io/address-pool: traefik
        metallb.io/allow-shared-ip: homelab-shared
      loadBalancerIP: 192.168.123.21

    ports:
      web:
        exposedPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        exposedPort: 443

    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
