---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    network-zone: dmz

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://helm.traefik.io/traefik

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      version: "39.0.7"
  values:
    global:
      sendAnonymousUsage: true

    api:
      dashboard: true
      basePath: /traefik

    certificatesResolvers:
      letsencrypt:
        acme:
          email: rene.kschamer@gmail.com
          storage: /data/acme.json
          dnsChallenge:
            provider: porkbun

    deployment:
      replicas: 1
      strategy: Recreate
      env:
        # Disable CNAME support for DNS challenge - ACME/LEGO would otherwise
        # follow the CNAME for *.kschamer.info to the dynamic IP, causing failure
        - name: LEGO_DISABLE_CNAME_SUPPORT
          value: "true"
        - name: PORKBUN_API_KEY
          valueFrom:
            secretKeyRef:
              name: traefik-dns-porkbun
              key: api-key
        - name: PORKBUN_SECRET_API_KEY
          valueFrom:
            secretKeyRef:
              name: traefik-dns-porkbun
              key: secret-key
        # CrowdSec bouncer API key - read by the crowdsec-bouncer-traefik-plugin
        # Secret must be created after CrowdSec LAPI is running:
        #   kubectl exec -n crowdsec deployment/crowdsec-lapi -- \
        #     cscli bouncers add traefik-bouncer -o raw
        # then sealed (see flux/dmz/crowdsec/crowdsec-bouncer-sealedsecret.yaml.instructions)
        - name: CROWDSEC_BOUNCER_API_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-bouncer-key
              key: api-key

    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 1Gi

    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik

    service:
      enabled: true
      type: LoadBalancer
      annotations:
        metallb.io/address-pool: traefik
        metallb.io/allow-shared-ip: homelab-shared
      loadBalancerIP: 192.168.123.21

    ports:
      web:
        exposedPort: 80
        # Redirect disabled during migration testing
        # http:
        #   redirections:
        #     entryPoint:
        #       to: websecure
        #       scheme: https
        #       permanent: true
      websecure:
        exposedPort: 443

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true

    # Enable access logs so the CrowdSec agent can parse them
    logs:
      access:
        enabled: true
        format: json
        fields:
          defaultMode: keep
          names:
            ServiceName: keep

    # CrowdSec bouncer plugin - inspects/blocks requests via CrowdSec LAPI + AppSec
    experimental:
      plugins:
        crowdsec-bouncer-traefik-plugin:
          moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
          version: "v1.5.1"
