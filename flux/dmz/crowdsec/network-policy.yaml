---
# =============================================================================
# CrowdSec Network Policy - DMZ Zone
# =============================================================================
# Agent is disabled — only LAPI and AppSec are running.
#
# DNS, in-cluster, and internet egress are already covered by the
# allow-dmz-essential-egress clusterwide policy. These policies only add
# restrictions on top of that baseline.
# =============================================================================

---
# CrowdSec LAPI - restrict ingress to DMZ zone only
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  description: "Allow only DMZ pods to reach CrowdSec LAPI"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: lapi

  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.namespace.labels.network-zone: dmz
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# CrowdSec AppSec - restrict ingress to Traefik only
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-appsec
  namespace: crowdsec
spec:
  description: "Allow only Traefik to submit requests to CrowdSec AppSec"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: appsec

  ingress:
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.namespace.labels.network-zone: dmz
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "7422"
              protocol: TCP
