apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "7.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
        max_streams_per_user: 0
      storage:
        type: filesystem

    singleBinary:
      replicas: 1
      # Mirror of the Prometheus anti-affinity: keep the two heaviest memory
      # tenants on separate workers. Soft rule so Loki still schedules when only
      # one worker is available. See docs/memory-situation.md.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      persistence:
        enabled: true
        storageClass: longhorn
        accessModes:
          - ReadWriteOnce
        size: 20Gi
        labels:
          recurring-job-group.longhorn.io/default: disabled
          recurring-job-group.longhorn.io/monitoring: enabled

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    monitoring:
      serviceMonitor:
        enabled: true

    gateway:
      enabled: true
      service:
        type: ClusterIP
