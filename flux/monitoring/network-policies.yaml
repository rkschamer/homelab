---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-to-grafana
  namespace: monitoring
spec:
  description: "Allow Traefik (DMZ) to route traffic to Grafana"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: dmz
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-egress
  namespace: monitoring
spec:
  description: "Allow Grafana to reach Prometheus and Loki within the monitoring namespace"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
  # Allow reaching other monitoring-zone pods (Prometheus :9090, Loki gateway :80)
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: monitoring
