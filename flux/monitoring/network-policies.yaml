---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-to-grafana
  namespace: monitoring
spec:
  description: "Allow Traefik (DMZ) to route traffic to Grafana"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: dmz
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-to-grafana
  namespace: monitoring
spec:
  description: "Allow Prometheus to scrape Grafana metrics"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: monitoring
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-egress
  namespace: monitoring
spec:
  description: "Allow Grafana to reach Prometheus and Loki within the monitoring namespace"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
  # Allow reaching other monitoring-zone pods (Prometheus :9090, Loki gateway :80)
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.namespace.labels.network-zone: monitoring

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-alertmanager-smtp-egress
  namespace: monitoring
spec:
  description: "Allow Alertmanager to reach MailerSend SMTP and resolve DNS"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
