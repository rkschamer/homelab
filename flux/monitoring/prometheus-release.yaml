apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-release
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "83.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # kube-state-metrics custom resource state config is kept in a separate file
  # and loaded here to avoid cluttering this release with ~200 lines of CRD mappings.
  # The ConfigMap is generated by kustomization.yaml; kustomizeconfig.yaml ensures
  # the hash-suffixed name is rewritten into this valuesFrom reference.
  valuesFrom:
    - kind: ConfigMap
      name: flux-kube-state-metrics-config
      valuesKey: kube-state-metrics-config.yaml
  values:
    cleanPrometheusOperatorObjectNames: true

    grafana:
      enabled: true
      # RollingUpdate is incompatible with ReadWriteOnce PVCs — the new pod cannot
      # mount the volume while the old pod still holds it. Recreate terminates the
      # old pod first, freeing the PVC before the new pod starts.
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null
      # set admin credentials from Kubernetes Secret
      admin:
        existingSecret: admin-secret
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      grafana.ini:
        auth.proxy:
          enabled: true
          header_name: Remote-User
          header_property: username
          auto_sign_up: true
          default_role: Admin
        auth:
          signout_redirect_url: https://auth.kschamer.info/logout
          disable_login_form: true

      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local
          isDefault: false
          jsonData:
            maxLines: 1000

    prometheus:
      service:
        type: ClusterIP
      prometheusSpec:
        retention: 7d
        retentionSize: 6GB
        scrapeInterval: 60s
        evaluationInterval: 60s
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi
        # Empty selectors + NilUsesHelmValues=false = discover all PodMonitors
        # cluster-wide, regardless of labels. Required to pick up the
        # flux-system PodMonitor which has no release label.
        podMonitorNamespaceSelector: {}
        podMonitorSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1500Mi

    # kube-proxy is replaced by Cilium's eBPF dataplane — no metrics to scrape.
    kubeProxy:
      enabled: false

    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi

    # Flux CRD → gotk_resource_info mapping is loaded via valuesFrom above.
    # Only resource limits are set here; collectors and customResourceState
    # come from the ConfigMap.
    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
