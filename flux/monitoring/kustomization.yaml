apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system

resources:
  - namespace.yaml
  - repositories.yaml
  - admin-secret.yaml
  - prometheus-release.yaml
  - loki-release.yaml
  - fluent-bit-release.yaml
  - ingress.yaml
  - network-policies.yaml

configMapGenerator:
  # Wraps kube-state-metrics-config.yaml into a ConfigMap consumed by the
  # prometheus-release HelmRelease via valuesFrom. Kustomize appends a content
  # hash to the name; kustomizeconfig.yaml propagates that hash into the
  # HelmRelease spec so changes trigger a Helm upgrade automatically.
  - name: flux-kube-state-metrics-config
    namespace: monitoring
    files:
      - kube-state-metrics-config.yaml
    options:
      labels:
        app.kubernetes.io/part-of: flux
        app.kubernetes.io/component: monitoring

# Teaches Kustomize to rewrite the hash-suffixed ConfigMap name into
# spec.valuesFrom[].name on HelmRelease resources.
configurations:
  - kustomizeconfig.yaml
