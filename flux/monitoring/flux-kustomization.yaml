---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-config
  interval: 10m0s
  path: ./flux/monitoring
  prune: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
