apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: loki
      namespace: monitoring
  chart:
    spec:
      chart: fluent-bit
      version: "0.57.x"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kind: DaemonSet
    service:
      type: NodePort

    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    tolerations:
      - operator: Exists

    # Expose a fixed NodePort so Talos can ship logs to this node-local service.
    # Talos nodes are configured to send to tcp://127.0.0.1:30517/.
    extraPorts:
      - name: talos-logs
        port: 5170
        containerPort: 5170
        nodePort: 30517
        protocol: TCP

    config:
      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 10MB
            Skip_Long_Lines On

        [INPUT]
            Name tcp
            Listen 0.0.0.0
            Port 5170
            Format json
            Tag talos.*
            Mem_Buf_Limit 10MB

      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Merge_Log On
            Keep_Log Off
            K8S-Logging.Parser On
            K8S-Logging.Exclude On

      outputs: |
        [OUTPUT]
            Name loki
            Match kube.*
            Host loki-gateway.monitoring.svc.cluster.local
            Port 80
            Labels cluster=homelab, job=fluent-bit
            label_keys $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name'],$kubernetes['host'],$kubernetes['labels']['app.kubernetes.io/name'],$kubernetes['labels']['app.kubernetes.io/component']
            line_format json
            auto_kubernetes_labels off
            Retry_Limit False

        [OUTPUT]
            Name loki
            Match talos.*
            Host loki-gateway.monitoring.svc.cluster.local
            Port 80
            Labels cluster=homelab, job=talos
            label_keys $node,$talos-service,$talos-level
            line_format json
            auto_kubernetes_labels off
            Retry_Limit False
