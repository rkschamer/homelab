apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: loki
      namespace: monitoring
  chart:
    spec:
      chart: fluent-bit
      version: "0.56.x"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kind: DaemonSet

    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    tolerations:
      - operator: Exists

    config:
      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 10MB
            Skip_Long_Lines On

      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Merge_Log On
            Keep_Log Off
            K8S-Logging.Parser On
            K8S-Logging.Exclude On

      outputs: |
        [OUTPUT]
            Name loki
            Match kube.*
            Host loki-gateway.monitoring.svc.cluster.local
            Port 80
            Labels cluster=homelab, job=fluent-bit
            LabelKeys $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name'],$kubernetes['host']
            LineFormat json
            AutoKubernetesLabels On
            Retry_Limit False
