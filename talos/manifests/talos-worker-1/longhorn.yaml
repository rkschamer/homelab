# Longhorn CSI storage volume
# This creates a formatted partition on the dedicated user volume disk (virtio2)
# and mounts it at /var/mnt/longhorn for use by Longhorn as hostPath storage
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    # Match the dedicated storage disk: non-system virtio disk larger than 100GB
    # This excludes the 64GB system disk (virtio0); the storage disk is virtio2.
    match: '!system_disk && disk.transport == "virtio" && disk.size > 100u * GiB'
  grow: true  # Use all available space on the disk
  minSize: 10GiB
encryption:
  provider: luks2
  keys:
    - tpm:
        options:
          pcrs: [7]
      slot: 0
      lockToState: true
